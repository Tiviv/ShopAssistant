<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopAssistant / Магазинер</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root {
    --bg: #faf9f6;
    --surface: #ffffff;
    --border: #e2e0d8;
    --text: #2c2c2a;
    --text-secondary: #6b6a63;
    --text-muted: #9a988f;
    --accent: #3b6d11;
    --accent-bg: #eaf3de;
    --danger: #a32d2d;
    --danger-bg: #fcebeb;
    --warning: #854f0b;
    --warning-bg: #faeeda;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
  }
  .app { display: flex; min-height: 100vh; }
  .sidebar {
    width: 190px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 1rem 0.6rem;
    display: flex;
    flex-direction: column;
  }
  .brand { font-weight: 600; font-size: 15px; padding: 0 0.5rem 1.2rem; }
  .navbtn {
    display: block;
    width: 100%;
    text-align: left;
    padding: 9px 10px;
    margin-bottom: 3px;
    border-radius: var(--radius);
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-size: 14px;
    cursor: pointer;
  }
  .navbtn.active { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
  .navbtn:hover:not(.active) { background: #f1f0ea; }
  main { flex: 1; padding: 1.5rem 2rem; min-width: 0; overflow: auto; }
  h2 { margin: 0 0 1rem; font-size: 20px; }
  h3 { font-size: 15px; margin: 1.2rem 0 0.6rem; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1rem 1.2rem; margin-bottom: 1rem; }
  .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
  input, select {
    width: 100%;
    padding: 7px 9px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 14px;
    background: var(--surface);
    color: var(--text);
  }
  label.field { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
  .field-wrap { margin-bottom: 10px; }
  button {
    padding: 7px 12px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { background: #f1f0ea; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.primary { background: var(--accent); color: white; border-color: var(--accent); }
  button.primary:hover { opacity: 0.9; }
  button.danger { color: var(--danger); }
  .grid { display: grid; gap: 10px; }
  table.data { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.data th { text-align: left; font-size: 12px; color: var(--text-muted); font-weight: 500; padding: 6px 4px; border-bottom: 1px solid var(--border); }
  table.data td { padding: 8px 4px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .muted { color: var(--text-secondary); }
  .metric { background: var(--accent-bg); border-radius: var(--radius); padding: 1rem; }
  .metric .label { font-size: 12px; color: var(--text-secondary); }
  .metric .value { font-size: 22px; font-weight: 600; margin-top: 2px; }
  .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 1.5rem; }
  .pill { padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; border: none; cursor: pointer; }
  .pill.paid { background: var(--accent-bg); color: var(--accent); }
  .pill.unpaid { background: var(--warning-bg); color: var(--warning); }
  .badge-low { color: var(--danger); }
  .actions-cell { display: flex; gap: 6px; justify-content: flex-end; }
  .item-row { display: grid; grid-template-columns: 2fr 0.9fr 0.9fr 0.9fr 1.1fr 30px; gap: 8px; margin-bottom: 6px; align-items: center; }
  .print-sheet { background: white; color: #111; padding: 2rem; max-width: 700px; margin: 0 auto; border: 1px solid #ddd; }
  .print-sheet table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .print-sheet th, .print-sheet td { padding: 6px 4px; text-align: right; }
  .print-sheet th:first-child, .print-sheet td:first-child { text-align: left; }
  .print-sheet thead tr { border-bottom: 1px solid #ccc; }
  .print-sheet tbody tr { border-bottom: 1px solid #eee; }
  .cat-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
  }
  .cat-row:last-of-type { border-bottom: none; }
  .savebar { display: flex; gap: 8px; margin-top: 8px; }
  .save-flash { font-size: 12px; color: var(--text-muted); min-height: 16px; margin-top: 8px; }
  .backup-warning { background: var(--warning-bg); color: var(--warning); padding: 0.8rem 1rem; border-radius: var(--radius); font-size: 13px; margin-bottom: 1rem; }
  .info-box { background: var(--accent-bg); color: var(--accent); padding: 0.8rem 1rem; border-radius: var(--radius); font-size: 13px; margin-bottom: 1rem; }
  .error-box { background: var(--danger-bg); color: var(--danger); padding: 0.8rem 1rem; border-radius: var(--radius); font-size: 13px; margin-bottom: 1rem; }
  @media print {
    .no-print { display: none !important; }
    .sidebar { display: none !important; }
    main { padding: 0; }
  }
  input[type="file"] { padding: 4px; }

  .sync-status { font-size: 11px; padding: 3px 8px; border-radius: 999px; display: inline-block; margin-bottom: 10px; }
  .sync-status.online { background: var(--accent-bg); color: var(--accent); }
  .sync-status.offline { background: var(--warning-bg); color: var(--warning); }
  .sync-status.syncing { background: #eef2fb; color: #2f4f9e; }

  .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
  .auth-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 2rem; width: 100%; max-width: 380px; }
  .auth-card h2 { text-align: center; }
  .auth-toggle { text-align: center; margin-top: 12px; font-size: 13px; }
  .auth-toggle a { color: var(--accent); cursor: pointer; text-decoration: underline; }
  .sidebar-footer { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--border); font-size: 11px; color: var(--text-muted); }
  .lang-toggle { display: flex; gap: 4px; margin-bottom: 8px; }
  .lang-toggle button {
    flex: 0 0 auto;
    padding: 3px 9px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.03em;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fff;
    color: var(--text-muted);
    cursor: pointer;
  }
  .lang-toggle button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .auth-card .lang-toggle { justify-content: flex-end; margin-bottom: 12px; }

  .field-error { color: var(--danger); font-size: 11px; margin-top: 3px; }
  .field-wrap.has-error input, .field-wrap.has-error select { border-color: var(--danger); }
  input:disabled, select:disabled { background: var(--bg); color: var(--text-secondary); cursor: not-allowed; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(20, 18, 14, 0.45); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 1rem; }
  .modal-card { background: var(--surface); border-radius: 12px; padding: 1.5rem; max-width: 420px; width: 100%; max-height: 85vh; overflow: auto; }
  .detail-row { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .detail-row .label { color: var(--text-secondary); }

  .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .search-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .search-box { max-width: 300px; }
  .mobile-topbar { display: none; }
  .sidebar-overlay { display: none; }

  @media (max-width: 768px) {
    .app { flex-direction: column; }
    .mobile-topbar {
      display: flex; align-items: center; gap: 10px;
      padding: 0.7rem 1rem; background: var(--surface); border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 40;
    }
    .mobile-topbar .brand { padding: 0; }
    .hamburger-btn { font-size: 16px; line-height: 1; padding: 6px 10px; }
    .sidebar {
      position: fixed; top: 0; left: 0; bottom: 0; width: 220px; z-index: 60;
      transform: translateX(-100%); transition: transform 0.2s ease;
      box-shadow: 2px 0 16px rgba(0, 0, 0, 0.2);
    }
    .sidebar.open { transform: translateX(0); }
    .sidebar-overlay.open {
      display: block; position: fixed; inset: 0; background: rgba(20, 18, 14, 0.4); z-index: 55;
    }
    main { padding: 0.85rem; }
    h2 { font-size: 18px; margin-bottom: 0.8rem; }
    .row { flex-direction: column; align-items: flex-start; gap: 10px; }
    .grid, .item-row { grid-template-columns: 1fr !important; }
    /* Two compact tiles per row instead of one full-width block each,
       so the day's numbers are visible without scrolling. */
    .metrics-grid { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-bottom: 1rem; }
    .metric { padding: 0.6rem 0.7rem; }
    .metric .label { font-size: 11px; }
    .metric .value { font-size: 17px; }
    .card { padding: 0.85rem 0.9rem; }
    table.data td, table.data th { padding: 7px 3px; }
    .actions-cell { flex-wrap: wrap; justify-content: flex-start; }

    /* Wide tables don't fit a phone no matter how much they're squeezed, so
       each row becomes a stacked card with its column name as the label. */
    table.mobile-cards thead { display: none; }
    table.mobile-cards, table.mobile-cards tbody { display: block; }
    table.mobile-cards tr {
      display: block;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 11px;
      margin-bottom: 8px;
    }
    table.mobile-cards td {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border: none;
      padding: 3px 0;
      text-align: right;
    }
    table.mobile-cards td::before {
      content: attr(data-label);
      color: var(--text-muted);
      font-size: 12px;
      text-align: left;
      flex-shrink: 0;
    }
    table.mobile-cards td.actions-cell {
      justify-content: flex-start;
      padding-top: 8px;
      margin-top: 4px;
      border-top: 1px solid var(--border);
    }
    table.mobile-cards td.actions-cell::before { content: none; }
    table.mobile-cards td.actions-cell button { flex: 1; min-width: 90px; }
  }
</style>
</head>

<div id="root"></div>

   ShopAssistant — Supabase-backed rewrite
   Same UI/behavior as the original offline (localStorage-only) version,
   but data lives in a Supabase project (free tier) instead of the browser:

     - multi-device sync (Realtime subscriptions)
     - server-side atomic invoice/offer/credit numbering (no more risk of
       two devices issuing the same invoice number)
     - stock is now decremented on invoice / restored on credit note

       backup file to migrate its products/customers/documents in here

// ---------- field validation ----------
// ЕИК (Bulstat/Commercial Register UIC): 9 digits for companies, 13 for branches/older records.
// ДДС number: "BG" + 9 (companies) or 10 (individuals/sole traders) digits.
// IBAN (Bulgaria): BG + 2 check digits + 4-letter bank code + 4-digit branch + 2-digit account type + 8 alphanumeric = 22 chars total.
function digitsOnly(s) { return String(s || "").replace(/\D/g, ""); }
function isValidEIK(s) { if (!s) return true; const d = digitsOnly(s); return d.length === 9 || d.length === 13; }
function isValidVAT(s) { if (!s) return true; return /^BG\d{9,10}$/.test(String(s).trim().toUpperCase()); }
function isValidIBAN(s) { if (!s) return true; return /^BG\d{2}[A-Z]{4}\d{4}\d{2}[A-Z0-9]{8}$/.test(String(s).replace(/\s/g, "").toUpperCase()); }
function isValidPhone(s) { if (!s) return true; const d = digitsOnly(s); return d.length >= 7 && d.length <= 13; }
function isValidEmail(s) { if (!s) return true; return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(s).trim()); }
function isValidMoney(v) { if (v === "" || v == null) return false; const n = Number(v); return !isNaN(n) && n >= 0; }

// =========================================================================
// DATA ACCESS LAYER (db)
// Every call the app makes to Supabase (auth, table CRUD, RPCs, realtime),
// named by what it does instead of inlined at ~40 call sites throughout the
// UI code. Behavior here is unchanged from before this layer existed — it
// is purely a seam. See docs/python-backend-plan.md: a future backend swap
// changes these function *bodies* one resource at a time; callers below
// don't need to change again when that happens.
// =========================================================================

// Low-level fetch to the Python backend, shaped to match what the rest of
// the app already expects from a Supabase call: { data, error }. Used both
// by db.pyFetch (authenticated, against the connected pyBackend) and by the
// connect flow below (unauthenticated, against a candidate URL being
// tried for the first time).
async function pyRequest(baseUrl, token, method, path, body) {
  try {
    const headers = { "Content-Type": "application/json" };
    if (token) headers.Authorization = `Bearer ${token}`;
    const res = await fetch(baseUrl.replace(/\/$/, "") + path, {
      method, headers, body: body === undefined ? undefined : JSON.stringify(body)
    });
    if (res.status === 204) return { data: null, error: null };
    let payload = null;
    try { payload = await res.json(); } catch (e) { /* empty body, e.g. some error responses */ }
    if (!res.ok) {
      const detail = payload && payload.detail;
      // FastAPI's own validation errors (422) come back as a list of
      // {loc, msg, type} objects rather than a plain string.
      const message = Array.isArray(detail) ? detail.map(d => d.msg).join("; ") : (detail || `HTTP ${res.status}`);
      return { data: null, error: { message } };
    }
    return { data: payload, error: null };
  } catch (e) {
    return { data: null, error: { message: e.message } };
  }
}
function usingPyBackendFor(table) {
  // Grows as more resources get a Python endpoint (see docs/python-backend-plan.md)
  // — one connection, whose scope widens with each phase.
  return ["products", "customers"].includes(table) && !!(pyBackend && pyBackend.token);
}

// The Supabase dashboard shows several URLs, and it's easy to copy the REST
// endpoint (".../rest/v1/") instead of the bare Project URL. supabase-js
// appends its own paths, so that yields ".../rest/v1/rest/v1/products" and
// every request fails with "Invalid path specified in request URL" — while
// login fails differently, since auth lives under /auth/v1. Rather than trust
// the input, strip any API path back to the project origin.
function normalizeProjectUrl(u) {
  return String(u || "").trim()
    .replace(/\/+$/, "")
    .replace(/\/(rest|auth|storage|realtime|functions)\/v\d+$/i, "")
    .replace(/\/+$/, "");
}
function loadConfig() {
  try {
    const c = JSON.parse(localStorage.getItem(CONFIG_KEY)) || null;
    if (!c || !c.url) return c;
    // Repair a connection that was saved wrong before this check existed:
    // otherwise the browser stays broken, and re-opening a corrected share
    // link can't help — that only applies when nothing is saved at all.
    const fixed = normalizeProjectUrl(c.url);
    if (fixed !== c.url) { c.url = fixed; localStorage.setItem(CONFIG_KEY, JSON.stringify(c)); }
    return c;
  } catch (e) { return null; }
}
function saveConfig(c) {
  localStorage.setItem(CONFIG_KEY, JSON.stringify({ ...c, url: normalizeProjectUrl(c.url) }));
}
function clearConfig() { localStorage.removeItem(CONFIG_KEY); cfg = null; }

function loadPyConfig() {

// =========================================================================
// Bootstrapping
// =========================================================================
// A share link (?url=...&key=...) lets someone open the app and land
// straight on login, instead of having to paste the Supabase connection
// details in by hand. Only applied when this browser has no saved config
// yet, so it never silently overrides an existing setup. The key here is
// the public "anon"/"publishable" key, which is safe to pass around openly
// (Row Level Security is the actual access control) — never the service_role key.
function applySharedConfigFromUrl() {
  const params = new URLSearchParams(location.search);
  const sharedUrl = params.get("url");
  const sharedKey = params.get("key");
  if (sharedUrl && sharedKey && !cfg) {
    saveConfig({ url: sharedUrl.trim(), anonKey: sharedKey.trim() });
    cfg = loadConfig();
  }
  if (params.has("url") || params.has("key")) {
    history.replaceState({}, "", location.pathname);
  }
}

// Must be read before createClient(), which consumes the auth fragment and
// rewrites the URL, erasing the "type=recovery" marker we need to see.
function isRecoveryUrl() {
  return (location.hash || "").includes("type=recovery")
    || new URLSearchParams(location.search).get("type") === "recovery";
}

async function boot() {
  // Set before anything else can rewrite the URL and erase the marker.
  if (isRecoveryUrl()) recoveryMode = true;
  document.documentElement.lang = lang;
  document.title = t("appName");
  applySharedConfigFromUrl();
  if (!cfg || !cfg.url || !cfg.anonKey) { render(); return; }
  if (typeof supabase === "undefined") {
    authError = t("supabaseLoadFail");
    render();
    return;
  }
  supabaseClient = supabase.createClient(cfg.url, cfg.anonKey);
  const { data } = await db.auth.getSession();
  session = data.session || null;
  db.auth.onAuthStateChange((event, s) => {
    if (event === "PASSWORD_RECOVERY") { recoveryMode = true; session = s; render(); return; }
    const wasLoggedIn = !!session;
    session = s;
    if (!!session !== wasLoggedIn) { dataLoaded = false; if (!session) teardownRealtime(); render(); if (session) loadAllData(); }
  });
  if (session && !recoveryMode) { await loadAllData(); } else { render(); }
}

// A day that ended without anyone closing it. The scheduled job in the
// database closes those overnight; asking for it here as well means forgotten
// days still get closed on a project where pg_cron could not be enabled. It
// only ever adds closings for days that are already over, so calling it on
// every load is safe, and an older database without the function just carries
// on without auto-closing.
async function closeForgottenDays() {
  try {
    const res = await db.closeMyFinishedDays();
    if (res.error) console.warn("Auto-close unavailable:", res.error.message);
  } catch (e) {
    console.warn("Auto-close unavailable:", e);
  }
}
async function loadAllData() {
  syncStatus = "syncing"; render();
  try {
    const uidUser = session.user.id;
    await closeForgottenDays();
    const [settingsRes, productsRes, customersRes, docsRes, cashRes, entriesRes] = await db.loadAll(uidUser);
    if (settingsRes.error || productsRes.error || customersRes.error || docsRes.error || cashRes.error || entriesRes.error) throw (settingsRes.error || productsRes.error || customersRes.error || docsRes.error || cashRes.error || entriesRes.error);

    let settingsRow = settingsRes.data;
    if (!settingsRow) {
      const ins = await db.insertDefaultSettings(uidUser);
      if (ins.error) throw ins.error;
      settingsRow = ins.data;
    }

    state = {
      settings: settingsRowToObj(settingsRow),
      products: productsRes.data,
      customers: customersRes.data.map(customerRowToObj),
      documents: docsRes.data.map(docRowToObj),
      cashClosings: cashRes.data.map(cashClosingRowToObj),
      cashEntries: entriesRes.data.map(cashEntryRowToObj)
    };
    dataLoaded = true; offline = false; syncStatus = "online";
    cacheState();
    setupRealtime();
  } catch (e) {
    console.error(e);
    const cached = loadCachedState();
    if (cached) { state = cached; dataLoaded = true; offline = true; syncStatus = "offline"; }
    else { syncStatus = "error"; }
  }
  render();
}

function setupRealtime() {
  teardownRealtime();
  const uidUser = session.user.id;
  realtimeChannel = db.subscribeRealtime(uidUser, refetchTable);
}
function teardownRealtime() { if (realtimeChannel) { db.unsubscribeRealtime(realtimeChannel); realtimeChannel = null; } }

async function refetchTable(table) {
  if (!session) return;
  const uidUser = session.user.id;
  if (table === "products") {
    const { data, error } = await db.listProducts(uidUser);
    if (!error) { state.products = data; cacheState(); render(); }
  } else if (table === "customers") {
    const { data, error } = await db.listCustomers(uidUser);
    if (!error) { state.customers = data.map(customerRowToObj); cacheState(); render(); }
  } else if (table === "documents") {
    const { data, error } = await db.listDocuments(uidUser);
    if (!error) { state.documents = data.map(docRowToObj); cacheState(); render(); }
  } else if (table === "settings") {
    const { data, error } = await db.getSettings(uidUser);
    if (!error && data) { state.settings = settingsRowToObj(data); cacheState(); render(); }
  } else if (table === "cash_closings") {
    const { data, error } = await db.listCashClosings(uidUser);
    if (!error) { state.cashClosings = data.map(cashClosingRowToObj); cacheState(); render(); }
  } else if (table === "cash_entries") {
    const { data, error } = await db.listCashEntries(uidUser);
    if (!error) { state.cashEntries = data.map(cashEntryRowToObj); cacheState(); render(); }
  }
}

function flashSaved(ok, msg) {
  syncStatus = ok ? "online" : "error";
  const flash = document.getElementById("save-flash");
  if (flash) { flash.textContent = msg || (ok ? t("savedToCloud") : t("saveErrorShort")); setTimeout(() => { if (flash) flash.textContent = ""; }, 1800); }
}

  authBusy = false;
  if (error) { authError = error.message === "Invalid login credentials" ? t("wrongCredentials") : error.message; render(); }
}
async function doSignup() {
  authBusy = true; authError = ""; authNotice = ""; render();
  const { error } = await db.auth.signUp({ email: authForm.email.trim(), password: authForm.password });
  authBusy = false;
  if (error) { authError = error.message; render(); return; }

// Sends a Supabase recovery email. The link in it brings the user back here
// with a short-lived recovery session, which flips the app into recoveryMode
// (see boot) so they can set a new password.
async function doPasswordReset() {
  const email = authForm.email.trim();
  if (!email || !isValidEmail(email)) { authError = t("invalidEmail"); render(); return; }
  authBusy = true; authError = ""; authNotice = ""; render();
  const { error } = await db.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  authBusy = false;
  if (error) { authError = error.message; render(); return; }
  authNotice = t("resetSent", { email });
  authScreen = "login"; render();
}
async function doUpdatePassword() {
  if (!newPasswordForm.password || newPasswordForm.password.length < 6) { authError = t("passwordMin6"); render(); return; }
  if (newPasswordForm.password !== newPasswordForm.confirm) { authError = t("passwordsDontMatch"); render(); return; }
  authBusy = true; authError = ""; render();
  const { error } = await db.auth.updateUser({ password: newPasswordForm.password });
  authBusy = false;
  if (error) {
    authError = /session missing|session_not_found|Auth session/i.test(error.message)
      ? t("linkExpired")
      : error.message;
    render();
    return;
  }
  newPasswordForm = { password: "", confirm: "" };
  recoveryMode = false;
  history.replaceState({}, "", location.pathname);
  authNotice = t("passwordChangedNotice");
  alert(t("passwordChanged"));
  if (session && !dataLoaded) { render(); await loadAllData(); } else { render(); }
}
function cancelRecovery() {
  recoveryMode = false; authError = ""; newPasswordForm = { password: "", confirm: "" };
  history.replaceState({}, "", location.pathname);
  render();
}
async function doLogout() {
  await db.auth.signOut();

  render();
}

// ---------- search / filtering ----------
function matchesSearch(parts, query) {
  const q = (query || "").trim().toLowerCase();
  if (!q) return true;
  return parts.filter(Boolean).join(" ").toLowerCase().includes(q);
}
// render() rebuilds the whole view, which would drop focus mid-typing, so the
// caret is put back where it was afterwards.
function updateSearch(kind, value) {
  if (kind === "product") productSearch = value;
  else if (kind === "customer") customerSearch = value;
  else docSearch = value;
  render();
  const el = document.getElementById("search-" + kind);
  if (el) { el.focus(); const n = el.value.length; el.setSelectionRange(n, n); }
}
function renderSearchBox(kind, value, placeholder, shownCount, totalCount) {
  return `
    <div class="search-row no-print">
      <input id="search-${kind}" class="search-box" value="${esc(value)}" oninput="updateSearch('${kind}', this.value)" placeholder="${esc(placeholder)}">
      ${value.trim() ? `<span class="muted" style="font-size:12px;">${shownCount} / ${totalCount}</span>` : ""}
    </div>
  `;
}

function render() {
  const root = document.getElementById("root");
  if (!cfg) { root.innerHTML = renderConnectionSetup(); return; }
  if (!supabaseClient) { root.innerHTML = renderConnectionSetup(); return; }
  if (recoveryMode) { root.innerHTML = renderNewPassword(); return; }
  if (!session) { root.innerHTML = renderAuth(); return; }
  if (!dataLoaded) { root.innerHTML = `<div class="auth-wrap"><div class="muted">${t("loadingData")}</div></div>`; return; }

  root.innerHTML = `

      <nav class="sidebar no-print ${sidebarOpen ? "open" : ""}" id="sidebar"></nav>
      <main id="content"></main>
    </div>
  `;
  renderSidebar();
  const content = document.getElementById("content");
  if (currentTab === "dashboard") content.innerHTML = renderDashboard();
  else if (currentTab === "products") content.innerHTML = renderProducts();
  else if (currentTab === "customers") content.innerHTML = renderCustomers();
  else if (currentTab === "invoices") content.innerHTML = renderDocuments("invoice", t("navInvoices"));
  else if (currentTab === "offers") content.innerHTML = renderDocuments("offer", t("navOffers"));

}

function newProduct() { editingProduct = { id: null, name: "", category: CATEGORIES[0], unit: UNITS[0], price: "", stock: "" }; productErrors = {}; render(); }
function editProduct(id) { editingProduct = { ...state.products.find(p => p.id === id) }; productErrors = {}; render(); }
function cancelProductEdit() { editingProduct = null; productErrors = {}; render(); }
function updateProductField(field, value) { editingProduct[field] = value; }
async function saveProduct() {
  productErrors = validateProduct(editingProduct);
  if (Object.keys(productErrors).length) { render(); return; }
  const row = { owner_id: session.user.id, name: editingProduct.name, category: editingProduct.category, unit: editingProduct.unit, price: Number(editingProduct.price) || 0, stock: editingProduct.stock === "" ? null : Number(editingProduct.stock) };
  let res;
  if (editingProduct.id) res = await db.updateRow("products", editingProduct.id, row);
  else res = await db.insertRow("products", row);
  if (res.error) { flashSaved(false, t("errorPrefix") + res.error.message); return; }
  const idx = state.products.findIndex(p => p.id === res.data.id);
  if (idx >= 0) state.products[idx] = res.data; else state.products.push(res.data);
  state.products.sort((a, b) => a.name.localeCompare(b.name, "bg"));
  editingProduct = null; productErrors = {};
  cacheState(); flashSaved(true); render();
}
async function deleteProduct(id) {
  if (!confirm(t("deleteProductConfirm"))) return;
  const res = await db.deleteRow("products", id);
  if (res.error) { flashSaved(false, t("errorPrefix") + res.error.message); return; }
  state.products = state.products.filter(p => p.id !== id);
  cacheState(); flashSaved(true); render();
}

// ---------- DOCUMENTS (invoices / offers) ----------
// settings.categories holds either the original plain array of added names, or
// the { custom, hidden } shape written since categories became editable. Reading
// both means renaming and deleting needed no database migration.
function catConfig() {
  const v = state.settings.categories;
  if (Array.isArray(v)) return { custom: v.slice(), hidden: [] };
  if (v && typeof v === "object") {
    return {
      custom: Array.isArray(v.custom) ? v.custom.slice() : [],
      hidden: Array.isArray(v.hidden) ? v.hidden.slice() : []
    };
  }
  return { custom: [], hidden: [] };
}
function categoryUsage(name) { return state.products.filter(p => p.category === name).length; }
// Bulgarian counts "1 продукт" but "2 продукта", so the singular is its own string.
function usageLabel(n) { return n === 1 ? t("usedByProduct") : t("usedByProducts", { n }); }

// One shared category list, used by both the product form and the department
// lines on an invoice. Built-in names first, then whatever the shop added, then
// any straggler still attached to a product (e.g. from an old import) so a
// category in use never silently disappears from the picker.
function allCategories() {
  const { custom, hidden } = catConfig();
  const inUse = state.products.map(p => p.category).filter(Boolean);
  const out = [], seen = new Set();
  for (const c of [...CATEGORIES, ...custom, ...inUse]) {
    if (!c || seen.has(c)) continue;
    // A removed built-in stays visible while products are still filed under it,
    // so nothing drops out of the picker while it is genuinely in use.
    if (hidden.includes(c) && !inUse.includes(c)) continue;
    seen.add(c); out.push(c);
  }
  return out;
}
async function saveCategories(cfg) {
  const res = await db.updateSettings(session.user.id, { categories: cfg });
  if (res.error) {
    // The shop owner gets one plain sentence — the real reason (a missing column
    // after a schema change, a dropped connection) means nothing to them. It goes
    // to the console instead, where whoever maintains the app can still read it.
    // alert(), not the sidebar flash: the caller re-renders right after this
    // returns, which would wipe the flash before it could be read — and on a
    // phone that element sits inside a closed menu anyway.
    console.error("saving category failed", res.error);
    alert(t("categorySaveFailed"));
    return false;
  }
  state.settings = settingsRowToObj(res.data);
  cacheState();
  return true;
}
async function addCategory() {
  const raw = prompt(t("newCategoryPrompt"));
  if (raw == null) return null;
  const name = raw.trim();
  if (!name) return null;
  const existing = allCategories().find(c => c.toLowerCase() === name.toLowerCase());
  if (existing) { alert(t("categoryExists", { name: existing })); return existing; }
  const cfg = catConfig();
  // Re-adding a built-in that was removed earlier just un-hides it, rather than
  // stacking a duplicate copy into the custom list.
  cfg.hidden = cfg.hidden.filter(c => c !== name);
  if (!CATEGORIES.includes(name) && !cfg.custom.includes(name)) cfg.custom.push(name);
  return (await saveCategories(cfg)) ? name : null;
}
async function renameCategory(oldName) {
  const raw = prompt(t("renameCategoryPrompt", { name: categoryLabel(oldName) }), oldName);
  if (raw == null) return;
  const name = raw.trim();
  if (!name || name === oldName) return;
  const clash = allCategories().find(c => c.toLowerCase() === name.toLowerCase() && c !== oldName);
  if (clash) { alert(t("categoryExists", { name: clash })); return; }
  const cfg = catConfig();
  if (CATEGORIES.includes(oldName)) { if (!cfg.hidden.includes(oldName)) cfg.hidden.push(oldName); }
  else cfg.custom = cfg.custom.filter(c => c !== oldName);
  cfg.hidden = cfg.hidden.filter(c => c !== name);
  if (!CATEGORIES.includes(name) && !cfg.custom.includes(name)) cfg.custom.push(name);
  // Products have to move with the rename, or the old name walks straight back
  // into the list as an "in use" category.
  if (categoryUsage(oldName)) {
    const res = await db.renameProductsCategory(session.user.id, oldName, name);
    if (res.error) { console.error("renaming category on products failed", res.error); alert(t("categorySaveFailed")); return; }
  }
  if (!await saveCategories(cfg)) return;
  // Documents keep the name they were issued with — an invoice already given to
  // a customer is a record, not something a later rename should rewrite.
  await refetchTable("products");
  render();
}
async function deleteCategory(name) {
  const used = categoryUsage(name);
  if (used) { alert(t("categoryInUse", { name: categoryLabel(name), n: usageLabel(used) })); return; }
  if (!confirm(t("deleteCategoryConfirm", { name: categoryLabel(name) }))) return;
  const cfg = catConfig();
  if (CATEGORIES.includes(name)) { if (!cfg.hidden.includes(name)) cfg.hidden.push(name); }
  else cfg.custom = cfg.custom.filter(c => c !== name);
  if (await saveCategories(cfg)) render();
}

function emptyManualCustomer() { return { name: "", eik: "", vatNumber: "", address: "" }; }
let docErrors = {};
// A one-off buyer — someone who may never accept the offer — gets their details
// typed straight onto the document instead of becoming a permanent customer.
function pickDocCustomer(value) {
  if (value === "__manual__") {
    docForm.manual = true;
    docForm.customerId = "";
    if (!docForm.manualCustomer) docForm.manualCustomer = emptyManualCustomer();
  } else {
    docForm.manual = false;
    docForm.customerId = value;
  }
  docErrors = {};
  render();
}
function updateManualCustomer(field, value) { docForm.manualCustomer[field] = value; }
// Only the fields that actually appear on the printed document are validated;
// phone and e-mail are not on it, so they are not asked for here.
function validateManualCustomer(c) {
  const errs = {};
  if (!c.name || !c.name.trim()) errs.name = t("errCustomerName");
  if (!isValidEIK(c.eik)) errs.eik = t("errEik");
  if (!isValidVAT(c.vatNumber)) errs.vatNumber = t("errVat");
  return errs;
}

function emptyLineItem() { return { id: uid(), productId: "", category: "", name: "", unit: "", qty: 1, price: 0, amountMode: false }; }

function newDoc(docType) {
  docForm = { docType, date: todayStr(), customerId: "", customerName: "", manual: false,
    manualCustomer: emptyManualCustomer(), items: [emptyLineItem()], vatRate: 20, paid: false, paymentMethod: "cash" };
  docErrors = {};
  creditForm = null; creditFormError = "";
  render();
}
// Editing keeps the document's existing number, so fixing a typo no longer
// costs a number the way delete-and-recreate did.
function editDoc(id) {
  const d = state.documents.find(x => x.id === id);
  if (!d) return;
  if (d.docType === "credit") { alert(t("creditNotEditable")); return; }
  if (d.docType === "invoice") {
    const credits = state.documents.filter(x => x.docType === "credit" && x.relatedInvoiceNumber === d.number);
    if (credits.length && !confirm(t("editWithCreditWarn", { n: d.number }))) return;
  }
  docForm = {
    editingId: d.id, number: d.number, docType: d.docType, date: d.date,
    customerId: d.customerId || "", customerName: d.customerName || "",
    // A document whose buyer was typed by hand reopens in manual mode, with the
    // details it was issued with rather than an empty form.
    manual: !d.customerId && !!(d.customerSnapshot || d.customerName),
    manualCustomer: d.customerSnapshot
      ? { name: d.customerSnapshot.name || d.customerName || "", eik: d.customerSnapshot.eik || "",
          vatNumber: d.customerSnapshot.vatNumber || "", address: d.customerSnapshot.address || "" }
      : { ...emptyManualCustomer(), name: d.customerName || "" },
    items: d.items.length ? d.items.map(it => ({ ...it })) : [emptyLineItem()],
    vatRate: d.vatRate, paid: d.paid, paymentMethod: d.paymentMethod || "cash"
  };
  docErrors = {};
  creditForm = null; creditFormError = ""; printingDocId = null;
  render();
}
function cancelDocForm() { docForm = null; render(); }
function updateDocField(field, value) { docForm[field] = field === "vatRate" ? Number(value) : value; renderDocFormTotalsOnly(); }
async function pickProductCategory(value) {
  if (value === "__new__") {
    const name = await addCategory();
    if (name) editingProduct.category = name;
    render();
    return;
  }
  editingProduct.category = value;
}
function addDocItem() { docForm.items.push(emptyLineItem()); render(); }
function removeDocItem(idx) { docForm.items.splice(idx, 1); render(); }
function updateItemField(idx, field, value) { docForm.items[idx][field] = value; renderDocFormTotalsOnly(); }
// A line is either a specific product ("p:<id>") or a whole department
// ("c:<category>"). Department lines carry no productId, so they never move
// stock — there is no single product to decrement for "20kg of fruit".
async function pickLineSource(idx, value) {
  const it = docForm.items[idx];
  if (value === "__new__") {
    const name = await addCategory();
    if (!name) { render(); return; }
    setCategoryLine(it, name);
    render();
    return;
  }
  if (value.startsWith("c:")) {
    setCategoryLine(it, value.slice(2));
    render();
    return;
  }
  const productId = value.startsWith("p:") ? value.slice(2) : "";
  const prod = state.products.find(p => p.id === productId);
  it.productId = productId;
  it.category = "";
  it.amountMode = false;
  if (prod) {
    it.name = prod.name;
    it.unit = prod.unit;
    it.price = Number(prod.price) || 0;
  } else {
    it.name = "";
  }
  render();
}
function setCategoryLine(it, category) {
  it.productId = "";
  it.category = category;
  it.name = category;
  if (!it.amountMode && !it.unit) it.unit = "";
}
function setLineMode(idx, mode) {
  const it = docForm.items[idx];
  it.amountMode = mode === "amount";
  // A flat-amount line is stored as qty 1 x price, so every total, credit note
  // and printout downstream keeps working on the same two numbers.
  if (it.amountMode) { it.qty = 1; it.unit = ""; }
  render();
}
function lineSourceValue(it) {
  if (it.productId) return "p:" + it.productId;
  if (it.category) return "c:" + it.category;
  return "";
}
function computeDocTotals() {
  const subtotal = docForm.items.reduce((s, it) => s + (Number(it.qty) || 0) * (Number(it.price) || 0), 0);
  const vatAmount = subtotal * (docForm.vatRate / 100);
  return { subtotal, vatAmount, total: subtotal + vatAmount };
}
function renderDocFormTotalsOnly() {
  const tot = computeDocTotals();
  const el = document.getElementById("doc-totals");
  if (el) el.innerHTML = `
    <div>${t("taxBase")}: ${money(tot.subtotal)}</div>
    <div>${t("vatLabel")} (${docForm.vatRate}%): ${money(tot.vatAmount)}</div>
    <div style="font-weight:600;">${t("total")}: ${money(tot.total)}</div>
  `;
}

async function applyStockAdjustments(items) {
  for (const it of items) {
    if (!it.productId || !it.name) continue;
    const qty = Number(it.qty) || 0;
    if (!qty) continue;
    const { error } = await db.adjustStock(it.productId, qty);
    if (error) console.error("stock adjust failed for", it.productId, error);
  }
  await refetchTable("products");
}

async function saveDoc() {
  if (docForm.manual) {
    docErrors = validateManualCustomer(docForm.manualCustomer);
    if (Object.keys(docErrors).length) { render(); return; }
  }
  if (docForm.items.every(it => !it.name)) { alert(t("addAtLeastOneProduct")); return; }
  const customer = docForm.manual ? null : state.customers.find(c => c.id === docForm.customerId);
  // Typed-in details are stored as the document's customer snapshot, which is
  // what the printed sheet reads — so the document prints identically whether
  // the buyer is on file or not.
  const manualSnap = docForm.manual
    ? { name: docForm.manualCustomer.name.trim(), eik: docForm.manualCustomer.eik.trim(),
        vatNumber: docForm.manualCustomer.vatNumber.trim(), address: docForm.manualCustomer.address.trim() }
    : null;
  const tot = computeDocTotals();

  const fields = {
    date: docForm.date, customer_id: docForm.manual ? null : (docForm.customerId || null),
    customer_name: customer ? customer.name : (manualSnap ? manualSnap.name : (docForm.customerName || "")),
    customer_snapshot: customer || manualSnap, items: docForm.items,
    vat_rate: docForm.vatRate, subtotal: tot.subtotal, vat_amount: tot.vatAmount, total: tot.total,
    paid: !!docForm.paid, payment_method: docForm.paymentMethod || "cash"
  };

  if (docForm.editingId) {
    const original = state.documents.find(x => x.id === docForm.editingId);
    // Snapshot the pre-edit lines before state is replaced — stock has to be
    // rewound by exactly what the old version took before the new one applies.
    const originalItems = original ? original.items.map(it => ({ ...it })) : [];
    const wasInvoice = original && original.docType === "invoice";
    const res = await db.updateRow("documents", docForm.editingId, fields);
    if (res.error) { flashSaved(false, t("errorPrefix") + res.error.message); return; }
    const updated = docRowToObj(res.data);
    const idx = state.documents.findIndex(x => x.id === updated.id);
    if (idx >= 0) state.documents[idx] = updated;
    docForm = null;
    cacheState(); flashSaved(true); render();
    if (wasInvoice) {
      await applyStockAdjustments(originalItems.map(it => ({ ...it, qty: -Number(it.qty) })));
      await applyStockAdjustments(updated.items);
    }
    alert(t("docUpdated", { n: updated.number }));
    return;
  }

  const { data: number, error: numErr } = await db.nextDocumentNumber(docForm.docType);
  if (numErr) { flashSaved(false, t("numberingError") + numErr.message); return; }

  const row = { owner_id: session.user.id, doc_type: docForm.docType, number, ...fields };
  const res = await db.insertRow("documents", row);
  if (res.error) { flashSaved(false, t("errorPrefix") + res.error.message); return; }
  state.documents.push(docRowToObj(res.data));
  docForm = null;
  cacheState(); flashSaved(true); render();

  if (row.doc_type === "invoice") await applyStockAdjustments(row.items);
  await refetchTable("settings");
}

// An offer that was written for a one-off buyer has no customer record behind
// it. Turning it into an invoice is the moment that buyer became real business,
// so that is where it is worth asking whether to keep them.
async function ensureCustomerForOffer(offerDoc) {
  const linked = offerDoc.customerId && state.customers.find(c => c.id === offerDoc.customerId);
  if (linked) return linked.id;
  const snap = offerDoc.customerSnapshot || {};
  const name = (snap.name || offerDoc.customerName || "").trim();
  if (!name) return null;
  // Someone added to the list since the offer was written should simply be
  // linked, not offered up as a duplicate.
  const known = state.customers.find(c =>
    normStr(c.name).toLowerCase() === name.toLowerCase() &&
    (!snap.eik || !normStr(c.eik) || normStr(c.eik) === normStr(snap.eik)));
  if (known) return known.id;
  if (!confirm(t("saveCustomerConfirm", { name }))) return null;
  const res = await db.insertRow("customers", {
    owner_id: session.user.id,
    ...customerObjToRow({ name, eik: snap.eik || "", vatNumber: snap.vatNumber || "",
      address: snap.address || "", phone: "", email: "" })
  });
  if (res.error) { console.error("saving customer from offer failed", res.error); flashSaved(false, t("errorPrefix") + res.error.message); return null; }
  state.customers.push(customerRowToObj(res.data));
  state.customers.sort((a, b) => a.name.localeCompare(b.name, "bg"));
  // Link the offer too, so the pair reads consistently afterwards.
  await db.linkDocumentCustomer(offerDoc.id, res.data.id);
  const idx = state.documents.findIndex(d => d.id === offerDoc.id);
  if (idx >= 0) state.documents[idx] = { ...state.documents[idx], customerId: res.data.id };
  alert(t("customerSavedAlert", { name }));
  return res.data.id;
}

async function convertToInvoice(id) {
  const offerDoc = state.documents.find(d => d.id === id);
  if (!confirm(t("convertConfirm", { n: offerDoc.number, sum: money(offerDoc.total) }))) return;
  const customerId = await ensureCustomerForOffer(offerDoc);
  const { data: number, error: numErr } = await db.nextDocumentNumber("invoice");
  if (numErr) { flashSaved(false, t("errorPrefix") + numErr.message); return; }
  const row = {
    owner_id: session.user.id, doc_type: "invoice", number, date: todayStr(),
    customer_id: customerId, customer_name: offerDoc.customerName, customer_snapshot: offerDoc.customerSnapshot,
    items: offerDoc.items, vat_rate: offerDoc.vatRate, subtotal: offerDoc.subtotal, vat_amount: offerDoc.vatAmount,
    total: offerDoc.total, paid: false, converted_from_offer_id: offerDoc.id, payment_method: offerDoc.paymentMethod || "cash"
  };
  const res = await db.insertRow("documents", row);
  if (res.error) { flashSaved(false, t("errorPrefix") + res.error.message); return; }
  state.documents.push(docRowToObj(res.data));
  cacheState(); flashSaved(true); render();
  await applyStockAdjustments(row.items);
  await refetchTable("settings");
  alert(t("convertedAlert", { n: number, from: offerDoc.number }));
}

// A credit note defaults to crediting every line at its full sold quantity
// (so a full return/void is still a single click), but each quantity is
// editable — set unwanted lines to 0 and reduce others for a partial return
// (e.g. the customer only sends the bananas back).
function beginCreditNote(invoiceId) {
  const invoice = state.documents.find(d => d.id === invoiceId);
  if (!invoice) return;
  docForm = null;
  creditForm = {
    invoiceId,
    items: invoice.items.filter(it => it.name).map(it => ({ ...it, creditQty: it.qty }))
  };
  creditFormError = "";
  render();
}
function cancelCreditForm() { creditForm = null; creditFormError = ""; render(); }
function updateCreditQty(idx, value) { creditForm.items[idx].creditQty = value; renderCreditFormTotalsOnly(); }
// A flat-amount line has no meaningful quantity, so it is credited by amount:
// the figure typed here is divided back into the qty x price the rest of the
// credit-note math already works on (qty is 1 on such a line, so it round-trips).
function creditAmountOf(it) {
  const q = Number(it.creditQty);
  return isValidMoney(it.creditQty) ? +(q * Number(it.price)).toFixed(2) : it.creditQty;
}
function updateCreditAmount(idx, value) {
  const it = creditForm.items[idx];
  const price = Number(it.price) || 0;
  it.creditQty = price ? String(Number(value) / price) : "0";
  renderCreditFormTotalsOnly();
}
function computeCreditTotals() {
  const invoice = state.documents.find(d => d.id === creditForm.invoiceId);
  const selected = creditForm.items.filter(it => isValidMoney(it.creditQty) && Number(it.creditQty) > 0);
  const subtotal = selected.reduce((s, it) => s + Number(it.creditQty) * Number(it.price), 0);
  const vatAmount = subtotal * (invoice.vatRate / 100);
  return { subtotal, vatAmount, total: subtotal + vatAmount, selected };
}
function renderCreditFormTotalsOnly() {
  const tot = computeCreditTotals();
  const el = document.getElementById("credit-totals");
  if (el) el.innerHTML = `
    <div>${t("taxBase")}: ${money(tot.subtotal)}</div>
    <div>${t("vatLabel")}: ${money(tot.vatAmount)}</div>
    <div style="font-weight:600;">${t("total")}: ${money(tot.total)}</div>
  `;
}
async function saveCreditNote() {
  const invoice = state.documents.find(d => d.id === creditForm.invoiceId);
  for (const it of creditForm.items) {
    if (!isValidMoney(it.creditQty)) { creditFormError = t("invalidQtyFor", { name: it.name }); render(); return; }
    if (Number(it.creditQty) > Number(it.qty) + 1e-9) { creditFormError = t("qtyExceedsSold", { name: it.name, qty: it.qty }); render(); return; }
  }
  const tot = computeCreditTotals();
  if (tot.selected.length === 0) { creditFormError = t("selectAtLeastOneQty"); render(); return; }
  creditFormError = "";
  if (!confirm(t("creditConfirm", { n: tot.selected.length, sum: money(tot.total), inv: invoice.number }))) return;

  const { data: number, error: numErr } = await db.nextDocumentNumber("credit");
  if (numErr) { flashSaved(false, t("errorPrefix") + numErr.message); return; }
  const items = tot.selected.map(it => ({ id: it.id, productId: it.productId, name: it.name, unit: it.unit, price: it.price, qty: -Math.abs(Number(it.creditQty)) }));
  const row = {
    owner_id: session.user.id, doc_type: "credit", number, date: todayStr(),
    customer_id: invoice.customerId, customer_name: invoice.customerName, customer_snapshot: invoice.customerSnapshot,
    items, vat_rate: invoice.vatRate, subtotal: -tot.subtotal, vat_amount: -tot.vatAmount, total: -tot.total,
    paid: false, related_invoice_number: invoice.number, payment_method: invoice.paymentMethod || "cash"
  };
  const res = await db.insertRow("documents", row);
  if (res.error) { flashSaved(false, t("errorPrefix") + res.error.message); return; }
  state.documents.push(docRowToObj(res.data));
  creditForm = null;
  cacheState(); flashSaved(true); render();
  await applyStockAdjustments(items);
  await refetchTable("settings");
  alert(t("creditIssued", { n: number, inv: invoice.number }));
}

async function deleteDocument(id) {
  const d = state.documents.find(x => x.id === id);
  if (!d) return;
  const typeLabel = d.docType === "invoice" ? t("typeInvoiceGen") : d.docType === "offer" ? t("typeOfferGen") : t("typeCreditGen");
  const stockNote = d.docType !== "offer" ? t("stockWillRevert") : "";
  if (!confirm(t("deleteDocConfirm", { type: typeLabel, n: d.number, sum: money(d.total), stock: stockNote }))) return;
  const res = await db.deleteRow("documents", id);
  if (res.error) { flashSaved(false, t("errorPrefix") + res.error.message); return; }
  state.documents = state.documents.filter(x => x.id !== id);
  cacheState(); flashSaved(true); render();
  if (d.docType !== "offer") {
    const reversedItems = d.items.map(it => ({ ...it, qty: -Number(it.qty) }));
    await applyStockAdjustments(reversedItems);
  }
}

async function togglePaid(id) {
  const d = state.documents.find(d => d.id === id);
  const res = await db.updateRow("documents", id, { paid: !d.paid });
  if (res.error) { flashSaved(false, t("errorPrefix") + res.error.message); return; }
  d.paid = res.data.paid;
  cacheState(); flashSaved(true); render();
}

// ---------- XLSX export ----------
// An .xlsx is a ZIP of XML parts, so it can be built here rather than pulling in
// a spreadsheet library: the app stays one file with no extra dependency. Entries
// are stored uncompressed, which Excel, LibreOffice and Google Sheets all accept.
function crc32(bytes) {
  let table = crc32.table;
  if (!table) {
    table = crc32.table = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
      table[n] = c >>> 0;
    }
  }
  let crc = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) crc = (crc >>> 8) ^ table[(crc ^ bytes[i]) & 0xFF];
  return (crc ^ 0xFFFFFFFF) >>> 0;
}
function zipStore(files) {
  const enc = new TextEncoder();
  const u16 = n => [n & 0xFF, (n >>> 8) & 0xFF];
  const u32 = n => [n & 0xFF, (n >>> 8) & 0xFF, (n >>> 16) & 0xFF, (n >>> 24) & 0xFF];
  const parts = [], central = [];
  let offset = 0;
  for (const f of files) {
    const name = enc.encode(f.name), data = enc.encode(f.xml), crc = crc32(data);
    // 0x0800 marks the file name as UTF-8; method 0 means stored, not deflated.
    const head = new Uint8Array([...u32(0x04034b50), ...u16(20), ...u16(0x0800), ...u16(0),
      ...u16(0), ...u16(0), ...u32(crc), ...u32(data.length), ...u32(data.length),
      ...u16(name.length), ...u16(0)]);
    parts.push(head, name, data);
    central.push({ name, crc, len: data.length, offset });
    offset += head.length + name.length + data.length;
  }
  const cd = [];
  for (const e of central) {
    cd.push(...u32(0x02014b50), ...u16(20), ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0),
      ...u32(e.crc), ...u32(e.len), ...u32(e.len), ...u16(e.name.length),
      ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(e.offset), ...e.name);
  }
  const cdBytes = new Uint8Array(cd);
  parts.push(cdBytes, new Uint8Array([...u32(0x06054b50), ...u16(0), ...u16(0),
    ...u16(central.length), ...u16(central.length), ...u32(cdBytes.length), ...u32(offset), ...u16(0)]));
  return new Blob(parts, { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
}
function xmlEsc(v) {
  return String(v == null ? "" : v)
    .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function colLetter(i) {
  let s = "";
  for (i += 1; i > 0; i = Math.floor((i - 1) / 26)) s = String.fromCharCode(65 + (i - 1) % 26) + s;
  return s;
}
// A cell is written as a number only when it is meant to be arithmetic. Everything
// else goes out as an inline string, which is what keeps ЕИК, ДДС numbers, IBANs
// and phone numbers from being turned into 1.23457E+12 by Excel.
function cellXml(ref, value, bold) {
  const st = bold ? ' s="1"' : "";
  if (typeof value === "number" && Number.isFinite(value)) return `<c r="${ref}"${st}><v>${value}</v></c>`;
  const text = xmlEsc(value);
  if (!text) return `<c r="${ref}"${st}/>`;
  return `<c r="${ref}"${st} t="inlineStr"><is><t xml:space="preserve">${text}</t></is></c>`;
}
function sheetXml(rows) {
  const body = rows.map((cells, r) => `<row r="${r + 1}">` +
    cells.map((v, c) => cellXml(colLetter(c) + (r + 1), v, r === 0)).join("") + "</row>").join("");
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
    `<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>${body}</sheetData></worksheet>`;
}
function safeSheetName(name, used) {
  let n = String(name).replace(/[\[\]:*?\/\\]/g, " ").slice(0, 31).trim() || "Sheet";
  let i = 2;
  while (used.has(n.toLowerCase())) n = (n.slice(0, 28) + " " + i++).trim();
  used.add(n.toLowerCase());
  return n;
}
function buildWorkbook(sheets) {
  const used = new Set();
  const named = sheets.map(sh => ({ name: safeSheetName(sh.name, used), rows: sh.rows }));
  const files = [
    { name: "[Content_Types].xml", xml: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
      `<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">` +
      `<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>` +
      `<Default Extension="xml" ContentType="application/xml"/>` +
      `<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>` +
      `<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>` +
      named.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("") +
      `</Types>` },
    { name: "_rels/.rels", xml: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
      `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">` +
      `<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>` +
      `</Relationships>` },
    { name: "xl/workbook.xml", xml: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
      `<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>` +
      named.map((sh, i) => `<sheet name="${xmlEsc(sh.name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join("") +
      `</sheets></workbook>` },
    { name: "xl/_rels/workbook.xml.rels", xml: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
      `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">` +
      named.map((_, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join("") +
      `<Relationship Id="rId${named.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>` +
      `</Relationships>` },
    { name: "xl/styles.xml", xml: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
      `<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">` +
      `<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts>` +
      `<fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills>` +
      `<borders count="1"><border/></borders><cellStyleXfs count="1"><xf/></cellStyleXfs>` +
      `<cellXfs count="2"><xf fontId="0" fillId="0" borderId="0" xfId="0"/><xf fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs>` +
      `</styleSheet>` }
  ];
  named.forEach((sh, i) => files.push({ name: `xl/worksheets/sheet${i + 1}.xml`, xml: sheetXml(sh.rows) }));
  return zipStore(files);
}

function docTypeLabel(kind) {
  return kind === "invoice" ? t("docInvoice") : kind === "offer" ? t("docOffer") : t("docCredit");
}
function exportExcel() {
  const yes = lang === "en" ? "yes" : "да", no = lang === "en" ? "no" : "не";
  const num = v => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
  const docs = [...state.documents].sort((a, b) =>
    a.date === b.date ? a.number - b.number : a.date.localeCompare(b.date));

  const sheets = [
    { name: t("sheetProducts"), rows: [[t("name"), t("category"), t("unit"), t("price"), t("stock")],
      ...state.products.map(p => [p.name, categoryLabel(p.category), unitLabel(p.unit), num(p.price),
        p.stock == null ? "" : num(p.stock)])] },
    { name: t("sheetCustomers"), rows: [[t("nameCompany"), t("eik"), t("vatNumber"), t("address"), t("phone"), t("email")],
      ...state.customers.map(c => [c.name, c.eik, c.vatNumber, c.address, c.phone, c.email])] },
    { name: t("sheetDocuments"), rows: [[t("colDocType"), t("numberShort"), t("date"), t("client"), t("eik"),
      t("taxBase"), t("vatLabel"), t("total"), t("status"), t("payment"), t("colRelated")],
      ...docs.map(d => [docTypeLabel(d.docType), num(d.number), d.date, d.customerName,
        (d.customerSnapshot && d.customerSnapshot.eik) || "", num(d.subtotal), num(d.vatAmount), num(d.total),
        d.paid ? yes : no, paymentLabel(d.paymentMethod), d.relatedInvoiceNumber ? num(d.relatedInvoiceNumber) : ""])] },
    // The line sheet is the nested part of a document flattened out, which is the
    // shape an accountant can actually pivot on.
    { name: t("sheetLines"), rows: [[t("colDocType"), t("numberShort"), t("date"), t("client"),
      t("colLineLabel"), t("unit"), t("qty"), t("unitPrice"), t("colLineSum")],
      ...docs.flatMap(d => (d.items || []).filter(it => it.name).map(it => [
        docTypeLabel(d.docType), num(d.number), d.date, d.customerName,
        it.category ? categoryLabel(it.category) : it.name,
        it.amountMode ? "" : unitLabel(it.unit),
        it.amountMode ? "" : num(it.qty),
        it.amountMode ? "" : num(it.price),
        num(it.qty) * num(it.price)]))] },
    { name: t("sheetClosings"), rows: [[t("date"), t("colTurnoverCash"), t("colTurnoverCard"), t("colTurnoverBank"),
      t("colDayTotal"), t("colInvoiceCount"), t("colEntryCount"), t("countedCol"), t("diffCol"), t("colAutoClosed"), t("note")],
      ...[...state.cashClosings].sort((a, b) => a.date.localeCompare(b.date)).map(c => {
        const dt = dayTotals(c.date, c);
        return [c.date, num(dt.byMethod.cash), num(dt.byMethod.card), num(dt.byMethod.bank), num(dt.total),
          num(dt.invoiceCount), num(dt.entryCount),
          c.autoClosed ? "" : num(c.countedCash),
          c.autoClosed ? "" : num(c.countedCash) - num(dt.byMethod.cash),
          c.autoClosed ? yes : no, c.note];
      })] },
    { name: t("sheetEntries"), rows: [[t("date"), t("amount"), t("paymentMethod"), t("note")],
      ...[...state.cashEntries].sort((a, b) => a.date.localeCompare(b.date))
        .map(c => [c.date, num(c.amount), paymentLabel(c.paymentMethod), c.note])] }
  ];

  if (sheets.every(sh => sh.rows.length <= 1)) { alert(t("excelEmpty")); return; }
  downloadBlob(buildWorkbook(sheets), "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
    `shopassistant-${todayStr()}.xlsx`);
}

function downloadBlob(content, mime, filename) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

// ---------- CASH REGISTER (daily close) ----------
// Expected totals combine three sources for the viewed day: invoices (add),
// credit notes against them (already negative, so they subtract), and
// manual entries for walk-in/retail sales that never got an invoice.
function computeCashSummary(date) {
  const docs = state.documents.filter(d => (d.docType === "invoice" || d.docType === "credit") && d.date === date);
  const entries = state.cashEntries.filter(e => e.date === date);
  const byMethod = { cash: 0, card: 0, bank: 0 };
  docs.forEach(d => { const m = d.paymentMethod || "cash"; byMethod[m] = (byMethod[m] || 0) + d.total; });
  entries.forEach(e => { const m = e.paymentMethod || "cash"; byMethod[m] = (byMethod[m] || 0) + Number(e.amount); });
  const docsTotal = docs.reduce((s, d) => s + d.total, 0);
  const entriesTotal = entries.reduce((s, e) => s + Number(e.amount), 0);
  const invoiceCount = docs.filter(d => d.docType === "invoice").length;
  return { byMethod, total: docsTotal + entriesTotal, invoiceCount, entries };
}
function closingFor(date) { return state.cashClosings.find(c => c.date === date) || null; }
// What the tab shows for a day: the sums saved when the day was closed, or —
// for a day still open, or one closed before the app saved its sums — a live
// count of that day's invoices and retail entries.
function dayTotals(date, closing) {
  if (closing && closing.totals) return closing.totals;
  const s = computeCashSummary(date);
  return { byMethod: s.byMethod, total: s.total, invoiceCount: s.invoiceCount, entryCount: s.entries.length };
}
// PostgREST reports a column the table doesn't have as PGRST204. Here that
// means the saved-totals columns are missing, i.e. the schema update hasn't
// been run yet — worth saying plainly instead of showing the raw error.
function isMissingColumnError(err) {
  return !!err && (err.code === "PGRST204" || /total_cash|invoice_count/.test(err.message || ""));
}
function updateCashViewDate(v) { cashViewDate = v; cashForm = null; cashEntryForm = null; render(); }
function beginCashEntry() {
  if (closingFor(cashViewDate)) { alert(t("closedDayLocked")); return; }
  cashEntryForm = { amount: "", paymentMethod: "cash", note: "" };
  render();
}
function updateCashEntryField(field, value) { cashEntryForm[field] = value; }
function cancelCashEntry() { cashEntryForm = null; render(); }
async function saveCashEntry() {
  if (closingFor(cashViewDate)) { alert(t("closedDayLocked")); return; }
  if (!isValidMoney(cashEntryForm.amount) || Number(cashEntryForm.amount) <= 0) { alert(t("enterValidAmount")); return; }
  const row = { owner_id: session.user.id, date: cashViewDate, amount: Number(cashEntryForm.amount), payment_method: cashEntryForm.paymentMethod, note: cashEntryForm.note || "" };
  const res = await db.insertRow("cash_entries", row);
  if (res.error) { flashSaved(false, t("errorPrefix") + res.error.message); return; }
  state.cashEntries.push(cashEntryRowToObj(res.data));
  cashEntryForm = null;
  cacheState(); flashSaved(true); render();
}
async function deleteCashEntry(id) {
  const entry = state.cashEntries.find(e => e.id === id);
  if (entry && closingFor(entry.date)) { alert(t("closedDayLocked")); return; }
  if (!confirm(t("deleteEntryConfirm"))) return;
  const res = await db.deleteRow("cash_entries", id);
  if (res.error) { flashSaved(false, t("errorPrefix") + res.error.message); return; }
  state.cashEntries = state.cashEntries.filter(e => e.id !== id);
  cacheState(); flashSaved(true); render();
}
function beginCashEdit() {
  if (closingFor(cashViewDate)) { alert(t("closedDayLocked")); return; }
  if (cashViewDate > localTodayStr()) { alert(t("futureDayNotice")); return; }
  cashForm = { countedCash: "", note: "" };
  render();
}
function updateCashField(field, value) { cashForm[field] = value; }
function cancelCashEdit() { cashForm = null; render(); }
// Closing writes the day's sums into the row alongside the counted cash, so a
// closed day keeps the figures it was closed on even if an invoice for that
// date is edited later. Reopening the day is the only way to change them.
async function saveCashClosing() {
  if (!isValidMoney(cashForm.countedCash)) { alert(t("enterValidCounted")); return; }
  const totals = dayTotals(cashViewDate, null);
  const row = {
    owner_id: session.user.id, date: cashViewDate,
    counted_cash: Number(cashForm.countedCash), note: cashForm.note || "", closed_at: new Date().toISOString(),
    total_cash: totals.byMethod.cash, total_card: totals.byMethod.card, total_bank: totals.byMethod.bank,
    total: totals.total, invoice_count: totals.invoiceCount, entry_count: totals.entryCount,
    auto_closed: false
  };
  const res = await db.upsertCashClosing(row);
  if (res.error) { flashSaved(false, isMissingColumnError(res.error) ? t("closingNeedsSchema") : t("errorPrefix") + res.error.message); return; }
  const obj = cashClosingRowToObj(res.data);
  const idx = state.cashClosings.findIndex(c => c.date === obj.date);
  if (idx >= 0) state.cashClosings[idx] = obj; else state.cashClosings.push(obj);
  cashForm = null;
  cacheState(); flashSaved(true); render();
}
async function reopenDay() {
  if (!confirm(t("reopenConfirm"))) return;
  const res = await db.deleteCashClosing(session.user.id, cashViewDate);
  if (res.error) { flashSaved(false, t("errorPrefix") + res.error.message); return; }
  state.cashClosings = state.cashClosings.filter(c => c.date !== cashViewDate);
  cashForm = null;
  cacheState(); flashSaved(true); render();
}
function diffLabel(diff) {

        <div class="savebar"><button class="primary" ${offline ? "disabled" : ""} onclick="saveCashClosing()">${t("saveClosing")}</button><button onclick="cancelCashEdit()">${t("cancel")}</button></div>

// ---------- REPORTS ----------
function renderReports() {
  const invoices = state.documents.filter(d => d.docType === "invoice");
  const byProduct = {};
  invoices.forEach(d => d.items.forEach(it => { if (it.name) byProduct[it.name] = (byProduct[it.name] || 0) + (Number(it.qty) || 0) * (Number(it.price) || 0); }));
  const topProducts = Object.entries(byProduct).sort((a, b) => b[1] - a[1]).slice(0, 10);
  const monthly = {};
  invoices.forEach(d => { const key = d.date.slice(0, 7); monthly[key] = (monthly[key] || 0) + d.total; });
  const monthlyList = Object.entries(monthly).sort((a, b) => a[0].localeCompare(b[0]));
  return `
    <h2>${t("reportsTitle")}</h2>
    <h3>${t("monthlyTurnover")}</h3>
    <div class="table-scroll">
    <table class="data"><tbody>
      ${monthlyList.length === 0 ? `<tr><td class="muted">${t("noDataYet")}</td></tr>` : monthlyList.map(([m, total]) => `<tr><td>${m}</td><td style="text-align:right">${money(total)}</td></tr>`).join("")}
    </tbody></table>
    </div>
    <h3>${t("topProducts")}</h3>
    <div class="table-scroll">
    <table class="data"><tbody>
      ${topProducts.length === 0 ? `<tr><td class="muted">${t("noDataYet")}</td></tr>` : topProducts.map(([name, total]) => `<tr><td>${esc(name)}</td><td style="text-align:right">${money(total)}</td></tr>`).join("")}
    </tbody></table>
    </div>
  `;
}

// ---------- SETTINGS ----------
let settingsForm = null;
function ensureSettingsForm() { if (!settingsForm) settingsForm = { ...state.settings }; }
function updateSettingsField(field, value) { ensureSettingsForm(); settingsForm[field] = value; }
function editSettings() { ensureSettingsForm(); settingsEditing = true; settingsErrors = {}; render(); }
function cancelSettingsEdit() { settingsForm = null; settingsEditing = false; settingsErrors = {}; render(); }
async function saveSettings() {
  ensureSettingsForm();
  settingsErrors = validateSettings(settingsForm);
  if (Object.keys(settingsErrors).length) { render(); return; }
  const res = await db.updateSettings(session.user.id, settingsObjToRow(settingsForm));
  if (res.error) { flashSaved(false, t("errorPrefix") + res.error.message); return; }
  state.settings = settingsRowToObj(res.data);
  settingsForm = null; settingsEditing = false; settingsErrors = {};
  cacheState(); flashSaved(true);
  settingsSavedAt = Date.now();
  render();
  setTimeout(() => { settingsSavedAt = null; render(); }, 4000);
}
function renderSettings() {
  ensureSettingsForm();
  const s = settingsForm;
  const editing = settingsEditing;
  const err = settingsErrors;
  const field = (label, key, placeholder) => `
    <div class="field-wrap ${err[key] ? "has-error" : ""}">
      <label class="field">${label}</label>
      <input value="${esc(s[key])}" ${placeholder ? `placeholder="${placeholder}"` : ""} ${editing ? `oninput="updateSettingsField('${key}', this.value)"` : "disabled"}>
      ${fieldError(err, key)}
    </div>`;
  return `
    <h2>${t("settingsTitle")}</h2>
    ${settingsSavedAt ? `<div class="info-box">${t("settingsSaved")}</div>` : ""}
    <div class="card">
      <div class="grid" style="grid-template-columns: 1fr 1fr;">
        ${field(t("companyName"), "companyName")}
        ${field(t("eik"), "eik")}
        ${field(t("vatNumber"), "vatNumber", "BG123456789")}
        ${field(t("mol"), "mol")}
        ${field(t("address"), "address")}
        ${field("IBAN", "iban", "BG00XXXX00000000000000")}
        <div class="field-wrap"><label class="field">${t("nextInvoiceNo")}</label><input value="${s.nextInvoiceNo}" disabled title="${t("autoNumberHint")}"></div>
        <div class="field-wrap"><label class="field">${t("nextOfferNo")}</label><input value="${s.nextOfferNo}" disabled></div>
      </div>
      ${editing
        ? `<div class="savebar"><button class="primary" ${offline ? "disabled" : ""} onclick="saveSettings()">${t("saveSettings")}</button><button onclick="cancelSettingsEdit()">${t("cancel")}</button></div>`
        : `<div class="savebar"><button ${offline ? "disabled" : ""} onclick="editSettings()">${t("edit")}</button></div>`}
    </div>
    <p class="muted">${t("accountantHint")}</p>
    ${renderCategoriesCard()}
    ${renderPyBackendCard()}
  `;
}

// ---------- Python backend connection (experimental) ----------
function renderPyBackendCard() {
  const connected = !!(pyBackend && pyBackend.token);
  return `
    <div class="card">
      <h3 style="margin-top:0;">${t("pyBackendTitle")}</h3>
      <p class="muted" style="margin-top:0;">${t("pyBackendHint")}</p>
      ${connected
        ? `<p>${t("pyBackendConnectedTo", { url: esc(pyBackend.url) })}</p>
           <button class="danger" onclick="disconnectPyBackend()">${t("pyBackendDisconnect")}</button>`
        : `<button onclick="connectPyBackend()">${t("pyBackendConnect")}</button>`}
    </div>
  `;
}
async function connectPyBackend() {
  const url = prompt(t("pyBackendUrlPrompt"), (pyBackend && pyBackend.url) || "http://localhost:8000");
  if (url == null) return;
  const trimmedUrl = url.trim().replace(/\/+$/, "");
  if (!trimmedUrl) return;
  const email = prompt(t("pyBackendEmailPrompt"));
  if (email == null || !email.trim()) return;
  const password = prompt(t("pyBackendPasswordPrompt"));
  if (password == null || !password) return;

  let res = await db.pyLogin(trimmedUrl, email.trim(), password);
  if (res.error) {
    // An unrecognized account is the common case on a first connect —
    // offer to create one on the spot rather than sending them hunting for
    // a separate signup screen.
    if (!confirm(t("pyBackendLoginFailedOfferSignup", { error: res.error.message }))) return;
    res = await db.pySignup(trimmedUrl, email.trim(), password);
    if (res.error) { alert(t("pyBackendConnectFailed", { error: res.error.message })); return; }
  }
  pyBackend = { url: trimmedUrl, token: res.data.access_token };
  savePyConfig(pyBackend);
  alert(t("pyBackendConnected"));
  await Promise.all([refetchTable("products"), refetchTable("customers")]);
  render();
}
async function disconnectPyBackend() {
  if (!confirm(t("pyBackendDisconnectConfirm"))) return;
  clearPyConfig();
  await Promise.all([refetchTable("products"), refetchTable("customers")]);
  render();
}

// The one shared list, managed in one place. Built-in and added categories are
// treated the same here on purpose — from the shop's side there is no reason
// "Сладки" should be less removable than something they typed themselves.

  return `
    <div class="card">
      <h3 style="margin-top:0;">${t("categoriesTitle")}</h3>
      <p class="muted" style="margin-top:0;">${t("categoriesHint")}</p>
      ${allCategories().map(c => {
        const used = categoryUsage(c);
        const arg = esc(c).replace(/'/g, "\\'");
        return `
        <div class="cat-row">
          <div>
            <div>${esc(categoryLabel(c))}</div>
            <div class="muted" style="font-size:12px;">${used ? usageLabel(used) : t("categoryNotUsed")}</div>
          </div>
          <div style="white-space:nowrap;">
            <button ${offline ? "disabled" : ""} onclick="renameCategory('${arg}')">${t("edit")}</button>
            <button class="danger" ${offline ? "disabled" : ""} onclick="deleteCategory('${arg}')">${t("del")}</button>
          </div>

      <button ${offline ? "disabled" : ""} onclick="addCategoryFromSettings()" style="margin-top:8px;">${t("addCategoryBtn")}</button>
