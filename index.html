<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Свежо и Вкусно — управление</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root {
    --bg: #faf9f6;
    --surface: #ffffff;
    --border: #e2e0d8;
    --text: #2c2c2a;
    --text-secondary: #6b6a63;
    --text-muted: #9a988f;
    --accent: #3b6d11;
    --accent-bg: #eaf3de;
    --danger: #a32d2d;
    --danger-bg: #fcebeb;
    --warning: #854f0b;
    --warning-bg: #faeeda;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
  }
  .app { display: flex; min-height: 100vh; }
  .sidebar {
    width: 190px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 1rem 0.6rem;
    display: flex;
    flex-direction: column;
  }
  .brand { font-weight: 600; font-size: 15px; padding: 0 0.5rem 1.2rem; }
  .navbtn {
    display: block;
    width: 100%;
    text-align: left;
    padding: 9px 10px;
    margin-bottom: 3px;
    border-radius: var(--radius);
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-size: 14px;
    cursor: pointer;
  }
  .navbtn.active { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
  .navbtn:hover:not(.active) { background: #f1f0ea; }
  main { flex: 1; padding: 1.5rem 2rem; min-width: 0; overflow: auto; }
  h2 { margin: 0 0 1rem; font-size: 20px; }
  h3 { font-size: 15px; margin: 1.2rem 0 0.6rem; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1rem 1.2rem; margin-bottom: 1rem; }
  .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
  input, select {
    width: 100%;
    padding: 7px 9px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 14px;
    background: var(--surface);
    color: var(--text);
  }
  label.field { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
  .field-wrap { margin-bottom: 10px; }
  button {
    padding: 7px 12px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { background: #f1f0ea; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.primary { background: var(--accent); color: white; border-color: var(--accent); }
  button.primary:hover { opacity: 0.9; }
  button.danger { color: var(--danger); }
  .grid { display: grid; gap: 10px; }
  table.data { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.data th { text-align: left; font-size: 12px; color: var(--text-muted); font-weight: 500; padding: 6px 4px; border-bottom: 1px solid var(--border); }
  table.data td { padding: 8px 4px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .muted { color: var(--text-secondary); }
  .metric { background: var(--accent-bg); border-radius: var(--radius); padding: 1rem; }
  .metric .label { font-size: 12px; color: var(--text-secondary); }
  .metric .value { font-size: 22px; font-weight: 600; margin-top: 2px; }
  .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 1.5rem; }
  .pill { padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; border: none; cursor: pointer; }
  .pill.paid { background: var(--accent-bg); color: var(--accent); }
  .pill.unpaid { background: var(--warning-bg); color: var(--warning); }
  .badge-low { color: var(--danger); }
  .actions-cell { display: flex; gap: 6px; justify-content: flex-end; }
  .item-row { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 30px; gap: 8px; margin-bottom: 6px; align-items: center; }
  .print-sheet { background: white; color: #111; padding: 2rem; max-width: 700px; margin: 0 auto; border: 1px solid #ddd; }
  .print-sheet table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .print-sheet th, .print-sheet td { padding: 6px 4px; text-align: right; }
  .print-sheet th:first-child, .print-sheet td:first-child { text-align: left; }
  .print-sheet thead tr { border-bottom: 1px solid #ccc; }
  .print-sheet tbody tr { border-bottom: 1px solid #eee; }
  .savebar { display: flex; gap: 8px; margin-top: 8px; }
  .save-flash { font-size: 12px; color: var(--text-muted); min-height: 16px; margin-top: 8px; }
  .backup-warning { background: var(--warning-bg); color: var(--warning); padding: 0.8rem 1rem; border-radius: var(--radius); font-size: 13px; margin-bottom: 1rem; }
  .info-box { background: var(--accent-bg); color: var(--accent); padding: 0.8rem 1rem; border-radius: var(--radius); font-size: 13px; margin-bottom: 1rem; }
  .error-box { background: var(--danger-bg); color: var(--danger); padding: 0.8rem 1rem; border-radius: var(--radius); font-size: 13px; margin-bottom: 1rem; }
  @media print {
    .no-print { display: none !important; }
    .sidebar { display: none !important; }
    main { padding: 0; }
  }
  input[type="file"] { padding: 4px; }

  .sync-status { font-size: 11px; padding: 3px 8px; border-radius: 999px; display: inline-block; margin-bottom: 10px; }
  .sync-status.online { background: var(--accent-bg); color: var(--accent); }
  .sync-status.offline { background: var(--warning-bg); color: var(--warning); }
  .sync-status.syncing { background: #eef2fb; color: #2f4f9e; }

  .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
  .auth-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 2rem; width: 100%; max-width: 380px; }
  .auth-card h2 { text-align: center; }
  .auth-toggle { text-align: center; margin-top: 12px; font-size: 13px; }
  .auth-toggle a { color: var(--accent); cursor: pointer; text-decoration: underline; }
  .sidebar-footer { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--border); font-size: 11px; color: var(--text-muted); }

  .field-error { color: var(--danger); font-size: 11px; margin-top: 3px; }
  .field-wrap.has-error input, .field-wrap.has-error select { border-color: var(--danger); }
  input:disabled, select:disabled { background: var(--bg); color: var(--text-secondary); cursor: not-allowed; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(20, 18, 14, 0.45); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 1rem; }
  .modal-card { background: var(--surface); border-radius: 12px; padding: 1.5rem; max-width: 420px; width: 100%; max-height: 85vh; overflow: auto; }
  .detail-row { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .detail-row .label { color: var(--text-secondary); }
</style>
</head>
<body>
<div id="root"></div>

<script>
/* =========================================================================
   ShopAssistant — Supabase-backed rewrite
   Same UI/behavior as the original offline (localStorage-only) version,
   but data lives in a Supabase project (free tier) instead of the browser:
     - real login (email + password via Supabase Auth)
     - multi-device sync (Realtime subscriptions)
     - server-side atomic invoice/offer/credit numbering (no more risk of
       two devices issuing the same invoice number)
     - stock is now decremented on invoice / restored on credit note
     - JSON export/import kept, including importing an old offline-app
       backup file to migrate its products/customers/documents in here
   ========================================================================= */

const UNITS = ["кг", "бр", "оп", "л", "г"];
const CATEGORIES = ["Плодове", "Зеленчуци", "Напитки", "Подправки", "Ориз и зърнени", "Сладки", "Други"];
const VAT_RATES = [20, 9, 0];
const CONFIG_KEY = "shopERP_supabase_config";
const CACHE_KEY = "shopERP_offline_cache_v1";

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function money(n) {
  const v = Number(n) || 0;
  return v.toLocaleString("bg-BG", { style: "currency", currency: "EUR", minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function todayStr() { return new Date().toISOString().slice(0, 10); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

// ---------- field validation ----------
// ЕИК (Bulstat/Commercial Register UIC): 9 digits for companies, 13 for branches/older records.
// ДДС number: "BG" + 9 (companies) or 10 (individuals/sole traders) digits.
// IBAN (Bulgaria): BG + 2 check digits + 4-letter bank code + 4-digit branch + 2-digit account type + 8 alphanumeric = 22 chars total.
function digitsOnly(s) { return String(s || "").replace(/\D/g, ""); }
function isValidEIK(s) { if (!s) return true; const d = digitsOnly(s); return d.length === 9 || d.length === 13; }
function isValidVAT(s) { if (!s) return true; return /^BG\d{9,10}$/.test(String(s).trim().toUpperCase()); }
function isValidIBAN(s) { if (!s) return true; return /^BG\d{2}[A-Z]{4}\d{4}\d{2}[A-Z0-9]{8}$/.test(String(s).replace(/\s/g, "").toUpperCase()); }
function isValidPhone(s) { if (!s) return true; const d = digitsOnly(s); return d.length >= 7 && d.length <= 13; }
function isValidEmail(s) { if (!s) return true; return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(s).trim()); }
function isValidMoney(v) { if (v === "" || v == null) return false; const n = Number(v); return !isNaN(n) && n >= 0; }
function isValidStockValue(v) { if (v === "" || v == null) return true; const n = Number(v); return !isNaN(n) && n >= 0; }

function validateProduct(p) {
  const errs = {};
  if (!p.name || !p.name.trim()) errs.name = "Въведете име.";
  if (!isValidMoney(p.price)) errs.price = "Цената трябва да е число ≥ 0.";
  if (!isValidStockValue(p.stock)) errs.stock = "Наличността трябва да е число ≥ 0.";
  return errs;
}
function validateCustomer(c) {
  const errs = {};
  if (!c.name || !c.name.trim()) errs.name = "Въведете име.";
  if (!isValidEIK(c.eik)) errs.eik = "ЕИК трябва да съдържа 9 или 13 цифри.";
  if (!isValidVAT(c.vatNumber)) errs.vatNumber = "Формат: BG + 9 или 10 цифри (напр. BG123456789).";
  if (!isValidPhone(c.phone)) errs.phone = "Телефонът трябва да съдържа 7–13 цифри.";
  if (!isValidEmail(c.email)) errs.email = "Невалиден имейл адрес.";
  return errs;
}
function validateSettings(s) {
  const errs = {};
  if (!isValidEIK(s.eik)) errs.eik = "ЕИК трябва да съдържа 9 или 13 цифри.";
  if (!isValidVAT(s.vatNumber)) errs.vatNumber = "Формат: BG + 9 или 10 цифри.";
  if (!isValidIBAN(s.iban)) errs.iban = "Формат: BG + 20 цифри/букви (общо 22 знака).";
  return errs;
}
function fieldError(errs, key) { return errs[key] ? `<div class="field-error">${esc(errs[key])}</div>` : ""; }

function defaultState() {
  return {
    settings: { companyName: "", eik: "", vatNumber: "", address: "", mol: "", iban: "", nextInvoiceNo: 1, nextOfferNo: 1, nextCreditNo: 1 },
    products: [],
    customers: [],
    documents: [],
    cashClosings: []
  };
}

const PAYMENT_METHODS = { cash: "В брой", card: "С карта", bank: "Банков превод" };

// ---------- row <-> app-object mapping (DB uses snake_case) ----------
function settingsRowToObj(row) {
  if (!row) return defaultState().settings;
  return {
    companyName: row.company_name || "", eik: row.eik || "", vatNumber: row.vat_number || "",
    address: row.address || "", mol: row.mol || "", iban: row.iban || "",
    nextInvoiceNo: row.next_invoice_no, nextOfferNo: row.next_offer_no, nextCreditNo: row.next_credit_no
  };
}
function settingsObjToRow(obj) {
  return {
    company_name: obj.companyName, eik: obj.eik, vat_number: obj.vatNumber,
    address: obj.address, mol: obj.mol, iban: obj.iban
  };
}
function customerRowToObj(row) {
  return { id: row.id, name: row.name, eik: row.eik, vatNumber: row.vat_number, address: row.address, phone: row.phone, email: row.email };
}
function customerObjToRow(obj) {
  return { name: obj.name, eik: obj.eik || "", vat_number: obj.vatNumber || "", address: obj.address || "", phone: obj.phone || "", email: obj.email || "" };
}
function docRowToObj(row) {
  return {
    id: row.id, docType: row.doc_type, number: row.number, date: row.date,
    customerId: row.customer_id, customerName: row.customer_name, customerSnapshot: row.customer_snapshot,
    items: row.items || [], vatRate: Number(row.vat_rate), subtotal: Number(row.subtotal), vatAmount: Number(row.vat_amount),
    total: Number(row.total), paid: row.paid, relatedInvoiceNumber: row.related_invoice_number,
    convertedFromOfferId: row.converted_from_offer_id, paymentMethod: row.payment_method || "cash", createdAt: row.created_at
  };
}
function cashClosingRowToObj(row) {
  return { date: row.date, countedCash: Number(row.counted_cash), note: row.note || "", closedAt: row.closed_at };
}

// ---------- global app state ----------
let cfg = loadConfig();
let supabaseClient = null;
let session = null;
let authScreen = "login"; // "login" | "signup"
let authError = "";
let authBusy = false;
let state = defaultState();
let dataLoaded = false;
let offline = false;
let syncStatus = "idle"; // idle | syncing | online | offline | error
let realtimeChannel = null;

let currentTab = "dashboard";
let editingProduct = null;
let editingCustomer = null;
let docForm = null;
let printingDocId = null;
let productErrors = {};
let customerErrors = {};
let settingsErrors = {};
let settingsEditing = false;
let settingsSavedAt = null;
let viewingCustomerId = null;
let cashViewDate = todayStr();
let cashForm = null;
let creditForm = null;
let creditFormError = "";

function loadConfig() {
  try { return JSON.parse(localStorage.getItem(CONFIG_KEY)) || null; } catch (e) { return null; }
}
function saveConfig(c) { localStorage.setItem(CONFIG_KEY, JSON.stringify(c)); }
function clearConfig() { localStorage.removeItem(CONFIG_KEY); cfg = null; }

function cacheState() {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(state)); } catch (e) {}
}
function loadCachedState() {
  try { const raw = localStorage.getItem(CACHE_KEY); return raw ? { ...defaultState(), ...JSON.parse(raw) } : null; } catch (e) { return null; }
}

// =========================================================================
// Bootstrapping
// =========================================================================
async function boot() {
  if (!cfg || !cfg.url || !cfg.anonKey) { render(); return; }
  if (typeof supabase === "undefined") {
    authError = "Не успяхме да заредим Supabase библиотеката (проверете интернет връзката и презаредете страницата).";
    render();
    return;
  }
  supabaseClient = supabase.createClient(cfg.url, cfg.anonKey);
  const { data } = await supabaseClient.auth.getSession();
  session = data.session || null;
  supabaseClient.auth.onAuthStateChange((_event, s) => {
    const wasLoggedIn = !!session;
    session = s;
    if (!!session !== wasLoggedIn) { dataLoaded = false; if (!session) teardownRealtime(); render(); if (session) loadAllData(); }
  });
  if (session) { await loadAllData(); } else { render(); }
}

async function loadAllData() {
  syncStatus = "syncing"; render();
  try {
    const uidUser = session.user.id;
    const [settingsRes, productsRes, customersRes, docsRes, cashRes] = await Promise.all([
      supabaseClient.from("settings").select("*").eq("owner_id", uidUser).maybeSingle(),
      supabaseClient.from("products").select("*").eq("owner_id", uidUser).order("name"),
      supabaseClient.from("customers").select("*").eq("owner_id", uidUser).order("name"),
      supabaseClient.from("documents").select("*").eq("owner_id", uidUser).order("created_at"),
      supabaseClient.from("cash_closings").select("*").eq("owner_id", uidUser).order("date")
    ]);
    if (settingsRes.error || productsRes.error || customersRes.error || docsRes.error || cashRes.error) throw (settingsRes.error || productsRes.error || customersRes.error || docsRes.error || cashRes.error);

    let settingsRow = settingsRes.data;
    if (!settingsRow) {
      const ins = await supabaseClient.from("settings").insert({ owner_id: uidUser }).select().single();
      if (ins.error) throw ins.error;
      settingsRow = ins.data;
    }

    state = {
      settings: settingsRowToObj(settingsRow),
      products: productsRes.data,
      customers: customersRes.data.map(customerRowToObj),
      documents: docsRes.data.map(docRowToObj),
      cashClosings: cashRes.data.map(cashClosingRowToObj)
    };
    dataLoaded = true; offline = false; syncStatus = "online";
    cacheState();
    setupRealtime();
  } catch (e) {
    console.error(e);
    const cached = loadCachedState();
    if (cached) { state = cached; dataLoaded = true; offline = true; syncStatus = "offline"; }
    else { syncStatus = "error"; }
  }
  render();
}

function setupRealtime() {
  teardownRealtime();
  const uidUser = session.user.id;
  realtimeChannel = supabaseClient.channel("shop-changes")
    .on("postgres_changes", { event: "*", schema: "public", table: "products", filter: `owner_id=eq.${uidUser}` }, () => refetchTable("products"))
    .on("postgres_changes", { event: "*", schema: "public", table: "customers", filter: `owner_id=eq.${uidUser}` }, () => refetchTable("customers"))
    .on("postgres_changes", { event: "*", schema: "public", table: "documents", filter: `owner_id=eq.${uidUser}` }, () => refetchTable("documents"))
    .on("postgres_changes", { event: "*", schema: "public", table: "settings", filter: `owner_id=eq.${uidUser}` }, () => refetchTable("settings"))
    .on("postgres_changes", { event: "*", schema: "public", table: "cash_closings", filter: `owner_id=eq.${uidUser}` }, () => refetchTable("cash_closings"))
    .subscribe();
}
function teardownRealtime() { if (realtimeChannel) { supabaseClient.removeChannel(realtimeChannel); realtimeChannel = null; } }

async function refetchTable(table) {
  if (!session) return;
  const uidUser = session.user.id;
  if (table === "products") {
    const { data, error } = await supabaseClient.from("products").select("*").eq("owner_id", uidUser).order("name");
    if (!error) { state.products = data; cacheState(); render(); }
  } else if (table === "customers") {
    const { data, error } = await supabaseClient.from("customers").select("*").eq("owner_id", uidUser).order("name");
    if (!error) { state.customers = data.map(customerRowToObj); cacheState(); render(); }
  } else if (table === "documents") {
    const { data, error } = await supabaseClient.from("documents").select("*").eq("owner_id", uidUser).order("created_at");
    if (!error) { state.documents = data.map(docRowToObj); cacheState(); render(); }
  } else if (table === "settings") {
    const { data, error } = await supabaseClient.from("settings").select("*").eq("owner_id", uidUser).maybeSingle();
    if (!error && data) { state.settings = settingsRowToObj(data); cacheState(); render(); }
  } else if (table === "cash_closings") {
    const { data, error } = await supabaseClient.from("cash_closings").select("*").eq("owner_id", uidUser).order("date");
    if (!error) { state.cashClosings = data.map(cashClosingRowToObj); cacheState(); render(); }
  }
}

function flashSaved(ok, msg) {
  syncStatus = ok ? "online" : "error";
  const flash = document.getElementById("save-flash");
  if (flash) { flash.textContent = msg || (ok ? "Запазено в облака" : "Грешка при запис"); setTimeout(() => { if (flash) flash.textContent = ""; }, 1800); }
}

// =========================================================================
// Connection setup screen (Supabase URL + anon key)
// =========================================================================
let connForm = { url: "", anonKey: "" };
function updateConnField(field, value) { connForm[field] = value; }
function saveConnection() {
  if (!connForm.url.trim() || !connForm.anonKey.trim()) { authError = "Попълнете и двете полета."; render(); return; }
  saveConfig({ url: connForm.url.trim(), anonKey: connForm.anonKey.trim() });
  cfg = loadConfig();
  authError = "";
  boot();
}
function renderConnectionSetup() {
  return `
    <div class="auth-wrap">
      <div class="auth-card">
        <h2>Свързване с облак (Supabase)</h2>
        <p class="muted" style="font-size:13px;">Създайте безплатен проект на <b>supabase.com</b>, изпълнете <code>supabase/schema.sql</code> от хранилището в неговия SQL Editor, после копирайте <b>Project URL</b> и <b>anon public key</b> от Settings → API тук.</p>
        ${authError ? `<div class="error-box">${esc(authError)}</div>` : ""}
        <div class="field-wrap"><label class="field">Project URL</label><input value="${esc(connForm.url)}" oninput="updateConnField('url', this.value)" placeholder="https://xxxx.supabase.co"></div>
        <div class="field-wrap"><label class="field">Anon public key</label><input value="${esc(connForm.anonKey)}" oninput="updateConnField('anonKey', this.value)" placeholder="eyJhbGciOi..."></div>
        <button class="primary" style="width:100%;" onclick="saveConnection()">Свързване</button>
      </div>
    </div>
  `;
}

// =========================================================================
// Auth screens
// =========================================================================
let authForm = { email: "", password: "" };
function updateAuthField(field, value) { authForm[field] = value; }
function switchAuthScreen(s) { authScreen = s; authError = ""; render(); }
async function doLogin() {
  authBusy = true; authError = ""; render();
  const { error } = await supabaseClient.auth.signInWithPassword({ email: authForm.email.trim(), password: authForm.password });
  authBusy = false;
  if (error) { authError = error.message === "Invalid login credentials" ? "Грешен имейл или парола." : error.message; render(); }
}
async function doSignup() {
  authBusy = true; authError = ""; render();
  const { error } = await supabaseClient.auth.signUp({ email: authForm.email.trim(), password: authForm.password });
  authBusy = false;
  if (error) { authError = error.message; render(); return; }
  authError = "Профилът е създаден. Ако имейл потвърждението е включено в Supabase, проверете пощата си, после влезте.";
  authScreen = "login"; render();
}
async function doLogout() {
  await supabaseClient.auth.signOut();
  teardownRealtime();
  dataLoaded = false; state = defaultState();
  render();
}
function forgetConnection() { if (confirm("Забравяне на връзката с Supabase на този компютър?")) { clearConfig(); location.reload(); } }

function renderAuth() {
  const isLogin = authScreen === "login";
  return `
    <div class="auth-wrap">
      <div class="auth-card">

// =========================================================================
// Navigation / shell
// =========================================================================
function setTab(tab) {
  currentTab = tab;
  editingProduct = null; editingCustomer = null; docForm = null; printingDocId = null;
  productErrors = {}; customerErrors = {}; settingsErrors = {};
  settingsForm = null; settingsEditing = false; settingsSavedAt = null;
  viewingCustomerId = null; cashForm = null;
  creditForm = null; creditFormError = "";
  render();
}

function render() {
  const root = document.getElementById("root");
  if (!cfg) { root.innerHTML = renderConnectionSetup(); return; }
  if (!supabaseClient) { root.innerHTML = renderConnectionSetup(); return; }
  if (!session) { root.innerHTML = renderAuth(); return; }
  if (!dataLoaded) { root.innerHTML = `<div class="auth-wrap"><div class="muted">Зареждане на данни…</div></div>`; return; }

  root.innerHTML = `
    <div class="app">
      <nav class="sidebar no-print" id="sidebar"></nav>
      <main id="content"></main>
    </div>
  `;
  renderSidebar();
  const content = document.getElementById("content");
  if (currentTab === "dashboard") content.innerHTML = renderDashboard();
  else if (currentTab === "products") content.innerHTML = renderProducts();
  else if (currentTab === "customers") content.innerHTML = renderCustomers();
  else if (currentTab === "invoices") content.innerHTML = renderDocuments("invoice", "Фактури");
  else if (currentTab === "offers") content.innerHTML = renderDocuments("offer", "Оферти");
  else if (currentTab === "cash") content.innerHTML = renderCash();
  else if (currentTab === "reports") content.innerHTML = renderReports();
  else if (currentTab === "settings") content.innerHTML = renderSettings();
  else if (currentTab === "backup") content.innerHTML = renderBackup();
}

function renderSidebar() {
  const items = [
    ["dashboard", "Начало"], ["products", "Продукти"], ["customers", "Клиенти"],
    ["invoices", "Фактури"], ["offers", "Оферти"], ["cash", "Каса"], ["reports", "Справки"],
    ["settings", "Настройки"], ["backup", "Данни / Резервно копие"]
  ];
  const statusClass = offline ? "offline" : (syncStatus === "syncing" ? "syncing" : "online");
  const statusText = offline ? "Офлайн — само преглед" : (syncStatus === "syncing" ? "Синхронизиране…" : "На линия");
  document.getElementById("sidebar").innerHTML = `
    <div class="brand">Свежо и Вкусно</div>
    <div class="sync-status ${statusClass}">${statusText}</div>
    ${items.map(([id, label]) => `<button class="navbtn ${currentTab === id ? "active" : ""}" onclick="setTab('${id}')">${label}</button>`).join("")}

}

// ---------- DASHBOARD ----------
function renderDashboard() {
  const invoices = state.documents.filter(d => d.docType === "invoice");
  const now = new Date();
  const thisMonth = invoices.filter(d => { const dt = new Date(d.date); return dt.getMonth() === now.getMonth() && dt.getFullYear() === now.getFullYear(); });
  const monthTotal = thisMonth.reduce((s, d) => s + d.total, 0);
  const unpaid = invoices.filter(d => !d.paid);
  const recent = state.documents.slice(-5).reverse();
  return `
    <h2>Начало</h2>
    ${offline ? `<div class="backup-warning">Няма връзка с интернет — виждате последно синхронизираните данни. Редакциите са изключени, докато връзката се възстанови.</div>` : ""}
    <div class="metrics-grid">
      <div class="metric"><div class="label">Оборот този месец</div><div class="value">${money(monthTotal)}</div></div>
      <div class="metric"><div class="label">Фактури този месец</div><div class="value">${thisMonth.length}</div></div>
      <div class="metric"><div class="label">Неплатени фактури</div><div class="value">${unpaid.length}</div></div>
    </div>
    <h3>Последни документи</h3>

      <table class="data"><tbody>
        ${recent.map(d => `<tr><td>${d.docType === "invoice" ? "Фактура" : d.docType === "offer" ? "Оферта" : "Кредитно"} № ${d.number} — ${esc(d.customerName || "—")}</td><td style="text-align:right">${money(d.total)}</td></tr>`).join("")}

  `;
}

function cancelProductEdit() { editingProduct = null; productErrors = {}; render(); }
function updateProductField(field, value) { editingProduct[field] = value; }
async function saveProduct() {
  productErrors = validateProduct(editingProduct);
  if (Object.keys(productErrors).length) { render(); return; }
  const row = { owner_id: session.user.id, name: editingProduct.name, category: editingProduct.category, unit: editingProduct.unit, price: Number(editingProduct.price) || 0, stock: editingProduct.stock === "" ? null : Number(editingProduct.stock) };

// ---------- DOCUMENTS (invoices / offers) ----------
function emptyLineItem() { return { id: uid(), productId: "", name: "", unit: "", qty: 1, price: 0 }; }

function newDoc(docType) {
  docForm = { docType, date: todayStr(), customerId: "", customerName: "", items: [emptyLineItem()], vatRate: 20, paid: false, paymentMethod: "cash" };
  creditForm = null; creditFormError = "";
  render();
}
function cancelDocForm() { docForm = null; render(); }
function updateDocField(field, value) { docForm[field] = field === "vatRate" ? Number(value) : value; renderDocFormTotalsOnly(); }
function addDocItem() { docForm.items.push(emptyLineItem()); render(); }
function removeDocItem(idx) { docForm.items.splice(idx, 1); render(); }
function updateItemField(idx, field, value) { docForm.items[idx][field] = value; renderDocFormTotalsOnly(); }
function pickProduct(idx, productId) {
  const prod = state.products.find(p => p.id === productId);
  docForm.items[idx].productId = productId;
  if (prod) {
    docForm.items[idx].name = prod.name;
    docForm.items[idx].unit = prod.unit;
    docForm.items[idx].price = Number(prod.price) || 0;
    document.getElementById(`item-unit-${idx}`).value = prod.unit;
    document.getElementById(`item-price-${idx}`).value = prod.price;
  }
  renderDocFormTotalsOnly();
}
function computeDocTotals() {
  const subtotal = docForm.items.reduce((s, it) => s + (Number(it.qty) || 0) * (Number(it.price) || 0), 0);
  const vatAmount = subtotal * (docForm.vatRate / 100);
  return { subtotal, vatAmount, total: subtotal + vatAmount };
}
function renderDocFormTotalsOnly() {
  const t = computeDocTotals();
  const el = document.getElementById("doc-totals");
  if (el) el.innerHTML = `
    <div>Данъчна основа: ${money(t.subtotal)}</div>
    <div>ДДС (${docForm.vatRate}%): ${money(t.vatAmount)}</div>
    <div style="font-weight:600;">Общо: ${money(t.total)}</div>
  `;
}

async function applyStockAdjustments(items) {
  for (const it of items) {
    if (!it.productId || !it.name) continue;
    const qty = Number(it.qty) || 0;
    if (!qty) continue;
    const { error } = await supabaseClient.rpc("adjust_stock", { p_product_id: it.productId, p_qty: qty });
    if (error) console.error("stock adjust failed for", it.productId, error);
  }
  await refetchTable("products");
}

async function saveDoc() {
  if (docForm.items.every(it => !it.name)) { alert("Добавете поне един продукт."); return; }
  const customer = state.customers.find(c => c.id === docForm.customerId);
  const t = computeDocTotals();

  const { data: number, error: numErr } = await supabaseClient.rpc("next_document_number", { p_doc_type: docForm.docType });
  if (numErr) { flashSaved(false, "Грешка при номериране: " + numErr.message); return; }

  const row = {
    owner_id: session.user.id, doc_type: docForm.docType, number,
    date: docForm.date, customer_id: docForm.customerId || null,
    customer_name: customer ? customer.name : (docForm.customerName || "Без данни"),
    customer_snapshot: customer || null, items: docForm.items,
    vat_rate: docForm.vatRate, subtotal: t.subtotal, vat_amount: t.vatAmount, total: t.total,
    paid: !!docForm.paid, payment_method: docForm.paymentMethod || "cash"
  };
  const res = await supabaseClient.from("documents").insert(row).select().single();
  if (res.error) { flashSaved(false, "Грешка: " + res.error.message); return; }
  state.documents.push(docRowToObj(res.data));
  docForm = null;
  cacheState(); flashSaved(true); render();

  if (row.doc_type === "invoice") await applyStockAdjustments(row.items);
  await refetchTable("settings");
}

async function convertToInvoice(id) {
  const offerDoc = state.documents.find(d => d.id === id);
  if (!confirm(`Превръщане на оферта № ${offerDoc.number} (${money(offerDoc.total)}) във фактура?`)) return;
  const { data: number, error: numErr } = await supabaseClient.rpc("next_document_number", { p_doc_type: "invoice" });
  if (numErr) { flashSaved(false, "Грешка: " + numErr.message); return; }
  const row = {
    owner_id: session.user.id, doc_type: "invoice", number, date: todayStr(),
    customer_id: offerDoc.customerId, customer_name: offerDoc.customerName, customer_snapshot: offerDoc.customerSnapshot,
    items: offerDoc.items, vat_rate: offerDoc.vatRate, subtotal: offerDoc.subtotal, vat_amount: offerDoc.vatAmount,
    total: offerDoc.total, paid: false, converted_from_offer_id: offerDoc.id, payment_method: offerDoc.paymentMethod || "cash"
  };
  const res = await supabaseClient.from("documents").insert(row).select().single();
  if (res.error) { flashSaved(false, "Грешка: " + res.error.message); return; }
  state.documents.push(docRowToObj(res.data));
  cacheState(); flashSaved(true); render();
  await applyStockAdjustments(row.items);
  await refetchTable("settings");
  alert(`Издадена фактура № ${number} от оферта № ${offerDoc.number}.`);
}

// A credit note defaults to crediting every line at its full sold quantity
// (so a full return/void is still a single click), but each quantity is
// editable — set unwanted lines to 0 and reduce others for a partial return
// (e.g. the customer only sends the bananas back).
function beginCreditNote(invoiceId) {
  const invoice = state.documents.find(d => d.id === invoiceId);
  if (!invoice) return;
  docForm = null;
  creditForm = {
    invoiceId,
    items: invoice.items.filter(it => it.name).map(it => ({ ...it, creditQty: it.qty }))
  };
  creditFormError = "";
  render();
}
function cancelCreditForm() { creditForm = null; creditFormError = ""; render(); }
function updateCreditQty(idx, value) { creditForm.items[idx].creditQty = value; renderCreditFormTotalsOnly(); }
function computeCreditTotals() {
  const invoice = state.documents.find(d => d.id === creditForm.invoiceId);
  const selected = creditForm.items.filter(it => isValidMoney(it.creditQty) && Number(it.creditQty) > 0);
  const subtotal = selected.reduce((s, it) => s + Number(it.creditQty) * Number(it.price), 0);
  const vatAmount = subtotal * (invoice.vatRate / 100);
  return { subtotal, vatAmount, total: subtotal + vatAmount, selected };
}
function renderCreditFormTotalsOnly() {
  const t = computeCreditTotals();
  const el = document.getElementById("credit-totals");
  if (el) el.innerHTML = `
    <div>Данъчна основа: ${money(t.subtotal)}</div>
    <div>ДДС: ${money(t.vatAmount)}</div>
    <div style="font-weight:600;">Общо: ${money(t.total)}</div>
  `;
}
async function saveCreditNote() {
  const invoice = state.documents.find(d => d.id === creditForm.invoiceId);
  for (const it of creditForm.items) {
    if (!isValidMoney(it.creditQty)) { creditFormError = `Невалидно количество за „${it.name}“.`; render(); return; }
    if (Number(it.creditQty) > Number(it.qty) + 1e-9) { creditFormError = `Количеството за „${it.name}“ не може да е повече от продаденото (${it.qty}).`; render(); return; }
  }
  const t = computeCreditTotals();
  if (t.selected.length === 0) { creditFormError = "Изберете количество поне за един продукт."; render(); return; }
  creditFormError = "";
  if (!confirm(`Издаване на кредитно известие за ${t.selected.length} артикул(а) на стойност ${money(t.total)} към фактура № ${invoice.number}?`)) return;

  const { data: number, error: numErr } = await supabaseClient.rpc("next_document_number", { p_doc_type: "credit" });
  if (numErr) { flashSaved(false, "Грешка: " + numErr.message); return; }
  const items = t.selected.map(it => ({ id: it.id, productId: it.productId, name: it.name, unit: it.unit, price: it.price, qty: -Math.abs(Number(it.creditQty)) }));
  const row = {
    owner_id: session.user.id, doc_type: "credit", number, date: todayStr(),
    customer_id: invoice.customerId, customer_name: invoice.customerName, customer_snapshot: invoice.customerSnapshot,
    items, vat_rate: invoice.vatRate, subtotal: -t.subtotal, vat_amount: -t.vatAmount, total: -t.total,
    paid: false, related_invoice_number: invoice.number, payment_method: invoice.paymentMethod || "cash"
  };
  const res = await supabaseClient.from("documents").insert(row).select().single();
  if (res.error) { flashSaved(false, "Грешка: " + res.error.message); return; }
  state.documents.push(docRowToObj(res.data));
  creditForm = null;
  cacheState(); flashSaved(true); render();
  await applyStockAdjustments(items);
  await refetchTable("settings");
  alert(`Издадено кредитно известие № ${number} към фактура № ${invoice.number}.`);
}

async function deleteDocument(id) {
  const d = state.documents.find(x => x.id === id);
  if (!d) return;
  const typeLabel = d.docType === "invoice" ? "фактура" : d.docType === "offer" ? "оферта" : "кредитно известие";
  const stockNote = d.docType !== "offer" ? " Наличностите на засегнатите продукти ще бъдат коригирани обратно." : "";
  if (!confirm(`Изтриване на ${typeLabel} № ${d.number} (${money(d.total)})? Номерът няма да бъде преизползван.${stockNote}`)) return;
  const res = await supabaseClient.from("documents").delete().eq("id", id);
  if (res.error) { flashSaved(false, "Грешка: " + res.error.message); return; }
  state.documents = state.documents.filter(x => x.id !== id);
  cacheState(); flashSaved(true); render();
  if (d.docType !== "offer") {
    const reversedItems = d.items.map(it => ({ ...it, qty: -Number(it.qty) }));
    await applyStockAdjustments(reversedItems);
  }
}

async function togglePaid(id) {
  const d = state.documents.find(d => d.id === id);
  const res = await supabaseClient.from("documents").update({ paid: !d.paid }).eq("id", id).select().single();
  if (res.error) { flashSaved(false, "Грешка: " + res.error.message); return; }
  d.paid = res.data.paid;
  cacheState(); flashSaved(true); render();
}

function backFromPrint() { printingDocId = null; render(); }

function exportDocsCSV(docType) {
  const list = state.documents.filter(d => d.docType === docType);
  const header = ["Номер", "Дата", "Клиент", "Данъчна основа", "ДДС", "Общо", "Платена"];
  const rows = list.map(d => [d.number, d.date, d.customerName, d.subtotal.toFixed(2), d.vatAmount.toFixed(2), d.total.toFixed(2), d.paid ? "да" : "не"]);
  const csv = [header, ...rows].map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\n");
  downloadBlob("﻿" + csv, "text/csv;charset=utf-8;", `${docType === "invoice" ? "fakturi" : "oferti"}_${todayStr()}.csv`);
}
function downloadBlob(content, mime, filename) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

// ---------- CASH REGISTER (daily close) ----------
function computeCashSummary(date) {
  const invoices = state.documents.filter(d => d.docType === "invoice" && d.date === date);
  const byMethod = { cash: 0, card: 0, bank: 0 };
  invoices.forEach(d => { const m = d.paymentMethod || "cash"; byMethod[m] = (byMethod[m] || 0) + d.total; });
  const total = invoices.reduce((s, d) => s + d.total, 0);
  return { byMethod, total, count: invoices.length };
}
function updateCashViewDate(v) { cashViewDate = v; cashForm = null; render(); }
function beginCashEdit() {
  const existing = state.cashClosings.find(c => c.date === cashViewDate);
  cashForm = existing ? { countedCash: existing.countedCash, note: existing.note } : { countedCash: "", note: "" };
  render();
}
function updateCashField(field, value) { cashForm[field] = value; }
function cancelCashEdit() { cashForm = null; render(); }
async function saveCashClosing() {
  if (!isValidMoney(cashForm.countedCash)) { alert("Въведете валидна преброена сума (число ≥ 0)."); return; }
  const row = { owner_id: session.user.id, date: cashViewDate, counted_cash: Number(cashForm.countedCash), note: cashForm.note || "", closed_at: new Date().toISOString() };
  const res = await supabaseClient.from("cash_closings").upsert(row, { onConflict: "owner_id,date" }).select().single();
  if (res.error) { flashSaved(false, "Грешка: " + res.error.message); return; }
  const obj = cashClosingRowToObj(res.data);
  const idx = state.cashClosings.findIndex(c => c.date === obj.date);
  if (idx >= 0) state.cashClosings[idx] = obj; else state.cashClosings.push(obj);
  cashForm = null;
  cacheState(); flashSaved(true); render();
}
function diffLabel(diff) {
  const cls = Math.abs(diff) < 0.005 ? "muted" : "badge-low";
  return `<span class="${cls}">${money(diff)}</span>`;
}
function renderCash() {
  const summary = computeCashSummary(cashViewDate);
  const existing = state.cashClosings.find(c => c.date === cashViewDate);
  const editing = !!cashForm;
  const liveDiff = editing && cashForm.countedCash !== "" && isValidMoney(cashForm.countedCash)
    ? Number(cashForm.countedCash) - summary.byMethod.cash : null;
  const history = state.cashClosings.slice().sort((a, b) => b.date.localeCompare(a.date)).slice(0, 14);
  return `
    <h2>Каса</h2>
    <div class="card">
      <div class="field-wrap" style="max-width:220px;"><label class="field">Ден</label><input type="date" value="${cashViewDate}" onchange="updateCashViewDate(this.value)"></div>
      <div class="metrics-grid">
        <div class="metric"><div class="label">Очаквано в брой</div><div class="value">${money(summary.byMethod.cash)}</div></div>
        <div class="metric"><div class="label">Очаквано с карта</div><div class="value">${money(summary.byMethod.card)}</div></div>
        <div class="metric"><div class="label">Очаквано с банков превод</div><div class="value">${money(summary.byMethod.bank)}</div></div>
        <div class="metric"><div class="label">Общо фактурирано (${summary.count})</div><div class="value">${money(summary.total)}</div></div>
      </div>
      ${editing ? `
        <div class="field-wrap"><label class="field">Преброена сума в брой (€)</label><input type="number" step="0.01" value="${esc(cashForm.countedCash)}" oninput="updateCashField('countedCash', this.value)"></div>
        <div class="field-wrap"><label class="field">Бележка (по избор)</label><input value="${esc(cashForm.note)}" oninput="updateCashField('note', this.value)" placeholder="напр. причина за разлика"></div>
        ${liveDiff !== null ? `<p>Разлика спрямо очакваното в брой: ${diffLabel(liveDiff)}</p>` : ""}
        <div class="savebar"><button class="primary" ${offline ? "disabled" : ""} onclick="saveCashClosing()">Запази приключване</button><button onclick="cancelCashEdit()">Отказ</button></div>
      ` : `
        ${existing ? `
          <p>Преброено в брой: <b>${money(existing.countedCash)}</b> — разлика: ${diffLabel(existing.countedCash - summary.byMethod.cash)}</p>
          ${existing.note ? `<p class="muted">${esc(existing.note)}</p>` : ""}
        ` : `<p class="muted">Денят още не е приключен.</p>`}
        <button class="primary" ${offline ? "disabled" : ""} onclick="beginCashEdit()">${existing ? "Редакция на приключването" : "Приключи деня"}</button>
      `}
    </div>
    <h3>История</h3>
    <table class="data">
      <thead><tr><th>Дата</th><th>Очаквано в брой</th><th>Преброено</th><th>Разлика</th></tr></thead>
      <tbody>
        ${history.length === 0 ? '<tr><td colspan="4" class="muted">Няма приключени дни още.</td></tr>' : history.map(c => {
          const s = computeCashSummary(c.date);
          return `<tr><td>${c.date}</td><td>${money(s.byMethod.cash)}</td><td>${money(c.countedCash)}</td><td>${diffLabel(c.countedCash - s.byMethod.cash)}</td></tr>`;
        }).join("")}
      </tbody>
    </table>
  `;
}

// ---------- REPORTS ----------
function renderReports() {
  const invoices = state.documents.filter(d => d.docType === "invoice");
  const byProduct = {};
  invoices.forEach(d => d.items.forEach(it => { if (it.name) byProduct[it.name] = (byProduct[it.name] || 0) + (Number(it.qty) || 0) * (Number(it.price) || 0); }));
  const topProducts = Object.entries(byProduct).sort((a, b) => b[1] - a[1]).slice(0, 10);
  const monthly = {};
  invoices.forEach(d => { const key = d.date.slice(0, 7); monthly[key] = (monthly[key] || 0) + d.total; });
  const monthlyList = Object.entries(monthly).sort((a, b) => a[0].localeCompare(b[0]));
  return `

      ${monthlyList.length === 0 ? '<tr><td class="muted">Няма данни още.</td></tr>' : monthlyList.map(([m, total]) => `<tr><td>${m}</td><td style="text-align:right">${money(total)}</td></tr>`).join("")}

}

  settingsForm = null; settingsEditing = false; settingsErrors = {};
  cacheState(); flashSaved(true);

  render();
  setTimeout(() => { settingsSavedAt = null; render(); }, 4000);
}

    </div>`;
  return `
    <h2>Настройки на фирмата</h2>
    ${settingsSavedAt ? `<div class="info-box">Настройките са запазени.</div>` : ""}
    <div class="card">
      <div class="grid" style="grid-template-columns: 1fr 1fr;">
        ${field("Име на фирма / ЕТ", "companyName")}
        ${field("ЕИК", "eik")}
        ${field("ДДС номер", "vatNumber", "BG123456789")}
        ${field("МОЛ", "mol")}
        ${field("Адрес", "address")}
        ${field("IBAN", "iban", "BG00XXXX00000000000000")}
        <div class="field-wrap"><label class="field">Следващ номер на фактура</label><input value="${s.nextInvoiceNo}" disabled title="Определя се автоматично от сървъра, за да не се дублират номера между устройства."></div>
        <div class="field-wrap"><label class="field">Следващ номер на оферта</label><input value="${s.nextOfferNo}" disabled></div>
      </div>
      ${editing
        ? `<div class="savebar"><button class="primary" ${offline ? "disabled" : ""} onclick="saveSettings()">Запази настройки</button><button onclick="cancelSettingsEdit()">Отказ</button></div>`
        : `<div class="savebar"><button ${offline ? "disabled" : ""} onclick="editSettings()">Редакция</button></div>`}
    </div>
    <p class="muted">Съвет: обсъдете със счетоводителя дали са нужни допълнителни стъпки, преди да започнете да изпращате фактури на клиенти.</p>
  `;
}

// ---------- BACKUP / DATA ----------
function downloadBackup() {
  downloadBlob(JSON.stringify(state, null, 2), "application/json", `svejo-vkusno-backup-${todayStr()}.json`);
}
function triggerImport() { document.getElementById("import-file-input").click(); }
async function handleImportFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async e => {
    try {
      const imported = JSON.parse(e.target.result);
      if (!imported.products && !imported.customers && !imported.documents) throw new Error("bad format");
      const nProd = (imported.products || []).length, nCust = (imported.customers || []).length, nDoc = (imported.documents || []).length;
      if (!confirm(`Ще се добавят ${nProd} продукта, ${nCust} клиента и ${nDoc} документа към текущите данни в облака (нищо няма да се изтрие). Продължи?`)) return;

      if (imported.products && imported.products.length) {
        const rows = imported.products.map(p => ({ owner_id: session.user.id, name: p.name, category: p.category || "", unit: p.unit || "", price: Number(p.price) || 0, stock: p.stock === "" || p.stock == null ? null : Number(p.stock) }));
        const { error } = await supabaseClient.from("products").insert(rows);
        if (error) throw error;
      }
      if (imported.customers && imported.customers.length) {
        const rows = imported.customers.map(c => ({ owner_id: session.user.id, ...customerObjToRow(c) }));
        const { error } = await supabaseClient.from("customers").insert(rows);
        if (error) throw error;
      }
      if (imported.documents && imported.documents.length) {
        const rows = imported.documents.map(d => ({
          owner_id: session.user.id, doc_type: d.docType, number: d.number, date: d.date,
          customer_name: d.customerName || "", customer_snapshot: d.customerSnapshot || null,
          items: d.items || [], vat_rate: d.vatRate, subtotal: d.subtotal, vat_amount: d.vatAmount, total: d.total,
          paid: !!d.paid, related_invoice_number: d.relatedInvoiceNumber || null, payment_method: d.paymentMethod || "cash"
        }));
        const { error } = await supabaseClient.from("documents").insert(rows);
        if (error) throw error;
        const maxByType = { invoice: 0, offer: 0, credit: 0 };
        rows.forEach(r => { if (r.number > maxByType[r.doc_type]) maxByType[r.doc_type] = r.number; });
        const updates = {};
        if (maxByType.invoice >= state.settings.nextInvoiceNo) updates.next_invoice_no = maxByType.invoice + 1;
        if (maxByType.offer >= state.settings.nextOfferNo) updates.next_offer_no = maxByType.offer + 1;
        if (maxByType.credit >= state.settings.nextCreditNo) updates.next_credit_no = maxByType.credit + 1;
        if (Object.keys(updates).length) await supabaseClient.from("settings").update(updates).eq("owner_id", session.user.id);
      }
      await loadAllData();
      alert("Данните са качени успешно.");
    } catch (err) {
      console.error(err);
      alert("Файлът не изглежда да е валиден резервен файл, или качването се провали: " + err.message);
    }
  };
  reader.readAsText(file);
}
function renderBackup() {
  return `
    <h2>Данни / Резервно копие</h2>
    <div class="info-box">
      Данните вече се пазят в облак (Supabase), синхронизирани на живо между всички устройства, на които влезете с този профил. Секцията по-долу е за допълнителна лична резервна копия и за пренасяне на данни от стария офлайн файл.
    </div>
    <div class="card">
      <h3 style="margin-top:0;">Изтегляне на резервно копие</h3>
      <p class="muted">Препоръчително веднъж месечно, като допълнителна застраховка извън облака.</p>
      <button class="primary" onclick="downloadBackup()">Изтегли резервно копие (JSON)</button>
    </div>
    <div class="card">
      <h3 style="margin-top:0;">Качване на данни от файл</h3>
      <p class="muted">Избери JSON файл (стар офлайн бекъп, или каталог с продукти) — данните ще се добавят към облака, без да трият текущите.</p>
      <input type="file" id="import-file-input" accept="application/json" style="display:none" onchange="handleImportFile(this)">
      <button ${offline ? "disabled" : ""} onclick="triggerImport()">Качи файл (JSON)</button>
    </div>
  `;
}

boot();
</script>
